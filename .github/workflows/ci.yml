# Build + full behavioural test run on every push and PR.
# The gate is tests/run-all.mjs — it fails on any suite problem or page error.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Hosted Edge Functions run the Deno 2.1-compatible runtime. Check the
      # exact computed deploy closures, including _shared and shared core.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.14
      - run: npm ci
      - run: node tools/check-functions.mjs
      # chromium for the file/served suites and bench3; webkit because
      # test16/test17 launch it — missing here, they die on browser
      # provisioning while green locally (three red runs, 2026-08-20)
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v3
        with:
          # Keep CI on the same CLI release used for the verified local reset.
          version: 2.115.0
      # Starts the same migration ledger in a temporary database-only project.
      # Edge closures are materialized and Deno-checked in the test job.
      - run: npm run db:start
      - run: supabase test db --local
      - run: supabase db lint --local --level warning --fail-on error
      - if: always()
        run: supabase stop --no-backup

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned bundletool verifier
        env:
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          curl --location --fail --silent --show-error \
            --output "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run native:sync:android
      - run: node --experimental-strip-types tests/androidship.test.ts --require-synced
      - name: Build Android debug app and unsigned release bundle
        working-directory: native/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - run: node --experimental-strip-types tests/androidship.test.ts --require-synced --require-built
      - uses: actions/upload-artifact@v4
        with:
          name: knucklebones-neon-unsigned-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
