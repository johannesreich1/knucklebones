# Build + the complete sharded behavioural gate on every push and PR.
# tests/run-all.mjs fails on any suite problem or page error; its manifest
# proves the four isolated jobs are exactly the same inventory as a local run.
name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer commit owns the current result for a branch or PR. Verification jobs
# use isolated hosted resources, so a superseded run is safe to cancel rather
# than letting it publish stale checks or an obsolete Android artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: test / manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Bootstrap the matrix independently: dropping a shard also has to pass
      # the exact-union and workflow-matrix contract before expensive jobs run.
      - run: node --experimental-strip-types tests/gate-manifest.test.ts

  test_shard:
    name: test / ${{ matrix.shard }}
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each shard reports its complete inventory even when a peer is red.
      fail-fast: false
      matrix:
        shard: [ci-1, ci-2, ci-3, ci-4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Hosted Edge Functions run the Deno 2.1-compatible runtime. Check the
      # exact computed deploy closures once, alongside the first web shard.
      - uses: denoland/setup-deno@v2
        if: matrix.shard == 'ci-1'
        with:
          deno-version: v2.1.14
      - run: npm ci
      - run: node tools/check-functions.mjs
        if: matrix.shard == 'ci-1'
      # THE APP SHIPS NO FONT FILES. src/styles/page.css names only OS faces:
      #   ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI",
      #   Roboto, sans-serif
      # A hosted runner has none of the first five, and on Linux `system-ui` is
      # not a font — it is whatever fontconfig ranks first. On this image that
      # is DejaVu Sans; on the bare Playwright image it is WenQuanYi Zen Hei, a
      # Chinese bitmap face. So the pixel suites were measuring a rendering no
      # player will ever see and reporting its metrics as layout defects.
      #
      # Roboto is the one family in the app's OWN stack that is redistributable
      # and packaged (Apple's are neither), and it is exactly what `system-ui`
      # resolves to on Android — so binding the generics to it makes these jobs
      # measure the shipping Android rendering instead of a Linux accident.
      # Installing the package is NOT enough on its own: `system-ui` precedes
      # `Roboto` in the stack, so without the alias below the runner still binds
      # DejaVu Sans and every number stays exactly as wrong as before.
      #
      # `<alias><prefer>` is deliberately narrower than a `prepend_first` match
      # rule: it rewrites ONLY these two generic names, so a test that asks for
      # an explicit `font-family: "DejaVu Sans"` still gets DejaVu Sans.
      # Pinned like the bundletool, Supabase and wrangler verifiers above.
      - name: Render in a font the app's own stack names
        env:
          FONTS_ROBOTO_VERSION: '2:0~20170802-3'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "fonts-roboto-unhinted=${FONTS_ROBOTO_VERSION}"
          printf '%s\n' \
            '<?xml version="1.0"?>' \
            '<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">' \
            '<fontconfig>' \
            '  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>' \
            '  <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>' \
            '</fontconfig>' \
            | sudo tee /etc/fonts/conf.d/59-knucklebones-app-stack.conf >/dev/null
          # Fail HERE with the cause rather than 300 lines later as geometry.
          fc-match system-ui | grep -q '"Roboto"'
          fc-match sans-serif | grep -q '"Roboto"'
      # chromium for the file/served suites and col-score-bench; webkit because
      # practice-sheet-stability and the online-ui tree launch it. Runners are
      # isolated and keep JOBS=1 inside
      # each balanced shard, avoiding browser contention in a two-core VM.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test -- --ci-shard "${{ matrix.shard }}"

  # Preserve the historical stable `test` check for branch protection and
  # downstream automation while the detailed shard checks stay visible.
  test:
    name: test
    # Aggregate ordinary failures, but never outlive a superseding revision.
    if: ${{ !cancelled() }}
    needs: [manifest, test_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require manifest and every test shard
        run: |
          test "${{ needs.manifest.result }}" = success
          test "${{ needs.test_shard.result }}" = success

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v3
        with:
          # Keep CI on the same CLI release used for the verified local reset.
          version: 2.115.0
      # Starts the same migration ledger in a temporary database-only project.
      # Edge closures are materialized and Deno-checked in the test job.
      - run: npm run db:start
      - run: supabase test db --local
      - run: supabase db lint --local --level warning --fail-on error
      - if: always()
        run: supabase stop --no-backup

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned bundletool verifier
        env:
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          curl --location --fail --silent --show-error \
            --output "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run native:sync:android
      - run: node --experimental-strip-types tests/androidship.test.ts --require-synced
      - name: Build Android debug app and unsigned release bundle
        working-directory: native/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - run: node --experimental-strip-types tests/androidship.test.ts --require-synced --require-built
      - uses: actions/upload-artifact@v4
        with:
          name: knucklebones-neon-unsigned-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  # Make production a consequence of a green gate instead of a race with it.
  # Cloudflare's dashboard git integration publishes `main` the moment it is
  # pushed, so today only local discipline keeps an unverified commit off the
  # live site. This job publishes the same `pwa/` output after the manifest
  # preflight and every shard passed, and stays skipped until the
  # DEPLOY_VIA_ACTIONS repository variable opts in — so landing it changes
  # nothing until Johannes adds the Cloudflare credentials, sets the variable,
  # and then disconnects the dashboard build. Pull requests never reach it.
  deploy:
    name: deploy / production
    needs: [manifest, test_shard]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VIA_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Publish what this repository's own build produces under the pinned
      # Node, not a separately configured dashboard build of the same commit.
      # The gateway origin is a build-time Vite value, so it has to be present
      # HERE: an unset variable is not an error, it silently produces a bundle
      # whose Game Center linking posts to a relative path and never works.
      # It is a variable rather than a secret because it ships in the bundle.
      - run: npm run build
        env:
          VITE_IDENTITY_GATEWAY_URL: ${{ vars.VITE_IDENTITY_GATEWAY_URL }}
      # The live site is a classic Pages project, so `pages deploy` — not
      # `wrangler deploy`, which would publish an unrelated Workers script.
      # `wrangler.jsonc` stays inert here: wrangler ignores a config without
      # `pages_build_output_dir` for this command. The CLI is pinned like the
      # Supabase and bundletool verifiers above; `--branch` is explicit because
      # the checkout is detached and only the production branch reaches the
      # live hostname. Override the project name with a repository variable if
      # the dashboard ever renames it.
      - run: >-
          npx --yes wrangler@4.126.0 pages deploy ./pwa
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'knucklebones' }}"
          --branch main
          --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
