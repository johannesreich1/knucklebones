<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1">
  <title>Knucklebones Neon — iOS App Store screenshots</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      --cyan: #28e8ff;
      --magenta: #ff2fa0;
      --gold: #ffd768;
      --ink: #05060e;
      --paper: #f7f8ff;
      --accent: var(--cyan);
      --accent-rgb: 40, 232, 255;
      --counter: "01 / 06";
      --canvas-width: 1320px;
      --canvas-height: 2868px;
      --outer-x: 112px;
      --brand-top: 112px;
      --copy-top: 264px;
      --headline-size: 151px;
      --headline-max: 1130px;
      --subhead-max: 1010px;
      --subhead-size: 41px;
      --halo-top: 840px;
      --halo-width: 1120px;
      --halo-height: 1750px;
      --screen-top: 776px;
      --screen-left: 187px;
      --screen-width: 946px;
      --screen-height: 2054px;
      --screen-radius: 78px;
      --runtime-width: 440px;
      --runtime-height: 956px;
      --runtime-scale: 2.15;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: var(--canvas-width);
      height: var(--canvas-height);
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      position: relative;
      color: var(--paper);
      isolation: isolate;
      transform: translateY(var(--capture-offset, 0px));
      transform-origin: 0 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body::before {
      content: "";
      position: absolute;
      inset: -12%;
      z-index: -5;
      background:
        radial-gradient(44% 31% at 12% 20%, rgba(255, 47, 160, .34), transparent 74%),
        radial-gradient(48% 36% at 91% 74%, rgba(40, 232, 255, .29), transparent 76%),
        radial-gradient(35% 24% at 62% 43%, rgba(var(--accent-rgb), .16), transparent 72%),
        linear-gradient(152deg, #090818 0%, #05060e 46%, #06101a 100%);
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      opacity: .30;
      background-image:
        linear-gradient(rgba(255, 255, 255, .022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .022) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .brand {
      position: absolute;
      top: var(--brand-top);
      left: var(--outer-x);
      right: var(--outer-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 36px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 25px;
      min-width: 0;
    }

    .brand img {
      width: 84px;
      height: 84px;
      border-radius: 23px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .16),
        0 18px 44px rgba(0, 0, 0, .38),
        0 0 42px rgba(var(--accent-rgb), .16);
    }

    .brand-name {
      min-width: 0;
      font-size: 31px;
      font-weight: 780;
      letter-spacing: .205em;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .count {
      flex: 0 0 auto;
      padding: 18px 24px 17px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      color: rgba(239, 243, 255, .72);
      background: rgba(7, 8, 20, .44);
      box-shadow: inset 0 1px rgba(255, 255, 255, .04);
      font-size: 24px;
      font-weight: 720;
      letter-spacing: .17em;
      text-transform: uppercase;
      backdrop-filter: blur(18px);
    }

    .copy {
      position: absolute;
      top: var(--copy-top);
      left: var(--outer-x);
      right: var(--outer-x);
      z-index: 3;
    }

    .eyebrow {
      margin-bottom: 30px;
      color: var(--accent);
      font-size: 27px;
      font-weight: 820;
      letter-spacing: .24em;
      text-transform: uppercase;
      text-shadow: 0 0 28px rgba(var(--accent-rgb), .32);
    }

    h1 {
      max-width: var(--headline-max);
      margin: 0;
      font-size: var(--headline-size);
      font-weight: 890;
      line-height: .91;
      letter-spacing: -.055em;
      text-wrap: balance;
      text-shadow: 0 16px 56px rgba(0, 0, 0, .40);
    }

    h1 .wash {
      margin-block: -.1em;
      padding-block: .1em;
      background: linear-gradient(105deg, var(--cyan), #ffffff 50%, var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 .headline-line {
      display: block;
      white-space: nowrap;
    }

    .subhead {
      max-width: var(--subhead-max);
      margin: 35px 0 0;
      color: rgba(239, 243, 255, .70);
      font-size: var(--subhead-size);
      font-weight: 510;
      line-height: 1.28;
      letter-spacing: -.014em;
    }

    .halo {
      position: absolute;
      top: var(--halo-top);
      left: 50%;
      z-index: -2;
      width: var(--halo-width);
      height: var(--halo-height);
      transform: translateX(-50%);
      border-radius: 48%;
      opacity: .55;
      background:
        radial-gradient(closest-side, rgba(var(--accent-rgb), .20), transparent 72%),
        radial-gradient(closest-side, rgba(255, 47, 160, .12), transparent 77%);
      filter: blur(64px);
    }

    .screen-shell {
      position: absolute;
      top: var(--screen-top);
      left: var(--screen-left);
      z-index: 2;
      width: var(--screen-width);
      height: var(--screen-height);
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, .15);
      border-radius: var(--screen-radius) var(--screen-radius) 0 0;
      background: #05060e;
      box-shadow:
        0 65px 120px rgba(0, 0, 0, .57),
        0 0 0 11px rgba(255, 255, 255, .025),
        0 0 100px rgba(var(--accent-rgb), .14);
    }

    .screen-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .18),
        inset 0 0 100px rgba(var(--accent-rgb), .025);
    }

    .screen-shell::after {
      content: "";
      position: absolute;
      top: 118px;
      bottom: 118px;
      left: 0;
      z-index: 6;
      width: 4px;
      border-radius: 0 99px 99px 0;
      background: linear-gradient(transparent, var(--accent) 20%, var(--accent) 80%, transparent);
      box-shadow: 0 0 30px rgba(var(--accent-rgb), .8);
      opacity: .72;
    }

    #runtime {
      display: block;
      width: var(--runtime-width);
      height: var(--runtime-height);
      border: 0;
      transform: scale(var(--runtime-scale));
      transform-origin: 0 0;
      background: #05060e;
    }

    .error {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 80px;
      background: #130710;
      color: #fff;
      font: 700 40px/1.35 ui-monospace, monospace;
      text-align: center;
    }

    body.failed .error { display: grid; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-lockup">
      <img src="/icon-512.png" alt="">
      <div class="brand-name">Knucklebones Neon</div>
    </div>
    <div class="count" id="count">01 / 06</div>
  </div>

  <main class="copy">
    <div class="eyebrow" id="eyebrow">Ranked Row Multiply</div>
    <h1 id="headline"><span class="wash">MATCH DICE.</span><br>MULTIPLY.</h1>
    <p class="subhead" id="subhead">Build two scoring rows, stack the multipliers, and turn the table.</p>
  </main>

  <div class="halo"></div>
  <div class="screen-shell">
    <iframe id="runtime" title="Real Knucklebones game rendering"></iframe>
  </div>

  <div class="error" id="error">The production game rendering did not initialize.</div>

  <script type="module">
    import { localeLanguageTag } from '/src/i18n/locale.ts';

    const failSource = (error) => {
      console.error(error);
      document.body.classList.add('failed');
      document.getElementById('error').textContent = error instanceof Error ? error.message : String(error);
      document.body.dataset.ready = 'error';
    };

    const SCENE_PRESENTATION = {
      'ranked-row-multiply': { accent: '#28e8ff', accentRgb: '40, 232, 255' },
      'ranked-mode-dial': { accent: '#ffd166', accentRgb: '255, 209, 102' },
      'ward-runic-seal': { accent: '#7dffc4', accentRgb: '125, 255, 196' },
      'sunder-overload': { accent: '#ff9d66', accentRgb: '255, 157, 102' },
      'ranked-bounty': { accent: '#ffd166', accentRgb: '255, 209, 102' },
      'neon-ladder': { accent: '#ff2fa0', accentRgb: '255, 47, 160' },
    };

    // The marketing canvas changes by device, while the iframe keeps the exact
    // CSS viewport the production WebView receives on that device family.
    const TARGET_LAYOUTS = {
      'iphone-6.9': {
        css: {
          '--outer-x': '112px', '--brand-top': '112px', '--copy-top': '264px', '--headline-size': '151px',
          '--headline-max': '1130px', '--subhead-max': '1010px', '--subhead-size': '41px',
          '--halo-top': '840px', '--halo-width': '1120px', '--halo-height': '1750px',
          '--screen-top': '776px', '--screen-left': '187px', '--screen-width': '946px',
          '--screen-height': '2054px', '--screen-radius': '78px',
          '--runtime-scale': '2.15',
        },
      },
      'ipad-13': {
        css: {
          '--outer-x': '144px', '--brand-top': '84px', '--copy-top': '222px', '--headline-size': '148px',
          '--headline-max': '1776px', '--subhead-max': '1540px', '--subhead-size': '39px',
          '--halo-top': '720px', '--halo-width': '1740px', '--halo-height': '1840px',
          '--screen-top': '740px', '--screen-left': '279px', '--screen-width': '1507px',
          '--screen-height': '2012px', '--screen-radius': '74px',
          '--runtime-scale': '1.46',
        },
      },
    };

    let manifest;
    try {
      const response = await fetch('/marketing/app-store/ios/manifest.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Screenshot manifest returned HTTP ${response.status}`);
      manifest = await response.json();
    } catch (error) {
      failSource(error);
      throw error;
    }

    const params = new URLSearchParams(location.search);
    const slideNumber = Number(params.get('slide')) || 1;
    const captureVariant = params.get('variant') || 'hero';
    const localeId = params.get('locale') || 'en-GB';
    const targetId = params.get('target') || 'iphone-6.9';
    const slide = manifest.slides?.find((candidate) => candidate.index === slideNumber);
    const localization = manifest.localizations?.[localeId];
    const target = manifest.targets?.find((candidate) => candidate.id === targetId);
    const layout = TARGET_LAYOUTS[targetId];
    if (!slide || !localization || !target || !layout) {
      const error = new Error(`Unknown capture selection: slide=${slideNumber}, locale=${localeId}, target=${targetId}`);
      failSource(error);
      throw error;
    }
    const runtimeViewport = target.runtimeViewport;
    if (!Number.isInteger(target.width) || !Number.isInteger(target.height)
        || !Number.isInteger(runtimeViewport?.width) || !Number.isInteger(runtimeViewport?.height)
        || !Number.isFinite(runtimeViewport?.safeAreaTop) || !Number.isFinite(runtimeViewport?.safeAreaBottom)) {
      const error = new Error(`${targetId} is missing deterministic canvas, runtime viewport, or safe-area geometry`);
      failSource(error);
      throw error;
    }
    const copy = localization.slides?.[slide.slug];
    const presentation = SCENE_PRESENTATION[slide.slug];
    const headlineLines = copy?.headlineLines ?? copy?.headline;
    if (!copy || !presentation || !Array.isArray(headlineLines) || headlineLines.length < 1) {
      const error = new Error(`Missing localized capture copy or presentation for ${localeId}/${slide.slug}`);
      failSource(error);
      throw error;
    }
    const runtimeLocale = localization.runtimeLocale;
    if (!['en', 'pt', 'es', 'de', 'fr', 'it', 'pl', 'tr', 'id', 'ja', 'ko'].includes(runtimeLocale)) {
      const error = new Error(`Unsupported runtime locale ${JSON.stringify(runtimeLocale)} for ${localeId}`);
      failSource(error);
      throw error;
    }

    for (const [name, value] of Object.entries(layout.css)) {
      document.documentElement.style.setProperty(name, value);
    }
    document.documentElement.style.setProperty('--canvas-width', `${target.width}px`);
    document.documentElement.style.setProperty('--canvas-height', `${target.height}px`);
    document.documentElement.style.setProperty('--runtime-width', `${runtimeViewport.width}px`);
    document.documentElement.style.setProperty('--runtime-height', `${runtimeViewport.height}px`);
    const runtimeLanguageTag = localeLanguageTag(runtimeLocale);
    document.documentElement.lang = runtimeLanguageTag;
    document.documentElement.style.setProperty('--accent', presentation.accent);
    document.documentElement.style.setProperty('--accent-rgb', presentation.accentRgb);
    document.getElementById('count').textContent = `${String(slideNumber).padStart(2, '0')} / ${String(manifest.slides.length).padStart(2, '0')}`;
    document.getElementById('eyebrow').textContent = copy.eyebrow;
    const headline = document.getElementById('headline');
    headline.replaceChildren(...headlineLines.map((line, index) => {
      const span = document.createElement('span');
      span.className = `headline-line${index === 0 ? ' wash' : ''}`;
      span.textContent = line;
      return span;
    }));
    document.getElementById('subhead').textContent = copy.subhead;

    const GAME_KEY = 'knucklebones.v1';
    const PROFILE_KEY = 'knucklebones.online.profile';
    localStorage.setItem(GAME_KEY, JSON.stringify({
      played: true,
      tutDone: true,
      sound: false,
      reducedMotion: true,
      localeOverride: runtimeLocale,
      p1Hue: 'cy',
      p2Hue: 'mg',
      colorblind: false,
      numerals: false,
      mode: 'cpu',
      diff: 'medium',
      timer: 0,
      seat: 'face',
      localMode: 0,
      spell: '',
    }));
    localStorage.setItem(PROFILE_KEY, JSON.stringify({
      nickname: 'FrostLynx303',
      avatar: 'die:5:cy',
      rating: 2494,
      rank: 4,
      apex: false,
    }));
    // Curve/progression answers are account-scoped runtime truth. A capture
    // page must never inherit either answer from the preceding scene.
    localStorage.removeItem('knucklebones.ranked-curve.v1');
    localStorage.removeItem('knucklebones.progression.v1');
    // Each capture page starts from an unauthenticated runtime. The ladder
    // scene installs its own deterministic session after the app has loaded;
    // clearing it here prevents that fixture leaking into the next page.
    localStorage.removeItem('sb-euzjcejbkxvqfrttgaxu-auth-token');

    const frame = document.getElementById('runtime');
    frame.src = `/knucklebones-neon.html?app-store-capture=${slideNumber}`;

    const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const twoFrames = (win) => new Promise((resolve) => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
    const waitFor = async (read, timeout = 10000) => {
      const started = performance.now();
      while (performance.now() - started < timeout) {
        const value = read();
        if (value) return value;
        await pause(25);
      }
      throw new Error('Timed out waiting for the game renderer');
    };
    let runtimeT = null;

    function applyNativeGeometry(win) {
      const doc = win.document;
      const app = doc.getElementById('app') || doc.getElementById('kbroot');
      if (app) {
        app.style.paddingTop = `calc(${runtimeViewport.safeAreaTop}px + 6px)`;
        app.style.paddingBottom = `calc(${runtimeViewport.safeAreaBottom}px + 6px)`;
      }
      win.__kb.fit();
    }

    function hideMenus(doc) {
      for (const id of ['ovStart', 'ovPractice', 'ovOnline', 'ovEnd']) {
        doc.getElementById(id)?.classList.remove('on');
      }
    }

    function startScene(k, {
      scoring,
      spell = '',
      mine,
      theirs,
      die,
      status = null,
      opponent = null,
      aiNormal = false,
    }) {
      k.S.spell = spell;
      k.S.timer = 0;
      k.S.localMode = scoring;
      k.S.mode = aiNormal ? 'cpu' : 'duo';
      k.S.diff = aiNormal ? 'medium' : k.S.diff;
      k.S.seat = aiNormal ? 'face' : 'side';
      k.S.starter = 1;
      k.newGame({ scoring, spell });
      k.S.gen++;
      k.S.mode = aiNormal ? 'cpu' : 'duo';
      k.S.diff = aiNormal ? 'medium' : k.S.diff;
      k.S.seat = aiNormal ? 'face' : 'side';
      k.S.boards[1] = mine;
      k.S.boards[0] = theirs;
      k.S.turn = 1;
      k.S.bottom = 1;
      k.S.phase = 'choose';
      k.S.busy = false;
      k.S.die = die;
      k.applySides();
      k.renderAll(false);
      k.setStageDie(die, 1);
      k.setStatus(status ?? runtimeT('online', 'play.yourMove'), 1);
      k.showHints();
      k.spells.render();
      k.setActivePlate();
      k.fit();

      const doc = document.getElementById('runtime').contentDocument;
      hideMenus(doc);
      if (opponent) {
        doc.getElementById('nameBot').textContent = 'FrostLynx303';
        doc.getElementById('nameTop').textContent = opponent;
        doc.getElementById('tagTop').hidden = true;
        doc.getElementById('tagBot').hidden = true;
        doc.getElementById('kbroot').classList.add('clock');
        const timer = doc.getElementById('timerWrap');
        timer.classList.add('on');
        timer.classList.remove('warn');
        timer.style.setProperty('--tcbase', 'var(--p1)');
        doc.getElementById('timerBar').style.width = '72%';
        doc.getElementById('timerNum').textContent = '';
        k.fit();
      }
    }

    const b64url = (win, value) => win.btoa(JSON.stringify(value))
      .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

    function installOnlineFixture(win, variant) {
      const USER_ID = '00000000-0000-4000-8000-00000000cafe';
      const now = Math.floor(Date.now() / 1000);
      const accessToken = `${b64url(win, { alg: 'HS256', typ: 'JWT' })}.${b64url(win, {
        sub: USER_ID,
        aud: 'authenticated',
        role: 'authenticated',
        is_anonymous: true,
        exp: now + 3600,
      })}.capture`;
      const session = {
        access_token: accessToken,
        token_type: 'bearer',
        expires_in: 3600,
        refresh_token: 'capture',
        expires_at: now + 3600,
        user: {
          id: USER_ID,
          aud: 'authenticated',
          role: 'authenticated',
          email: null,
          is_anonymous: true,
          created_at: '2026-08-01T00:00:00Z',
          app_metadata: {},
          user_metadata: {},
          identities: [],
        },
      };
      const isResult = variant === 'result';
      const profile = {
        id: USER_ID,
        nickname: 'FrostLynx303',
        rating: 3200,
        avatar: 'die:5:cy',
        created_at: '2026-08-01T00:00:00Z',
        named_at: '2026-08-01T00:00:00Z',
      };
      const board = [
        { rank: 1, nickname: 'PrismWolf771', points: 6673, wins: 88, losses: 34, games: 122, apex: true, avatar: 'die:6:gold', peak: 6673 },
        { rank: 2, nickname: 'NovaComet992', points: 4900, wins: 61, losses: 29, games: 90, apex: false, avatar: 'die:4:mg', peak: 4990 },
        { rank: 3, nickname: 'CipherMoth440', points: 3240, wins: 32, losses: 21, games: 53, apex: false, avatar: 'die:2:ice', peak: 3290 },
        { rank: 4, nickname: 'FrostLynx303', points: 3200, wins: 35, losses: 18, games: 55, apex: false, avatar: 'die:5:cy', peak: 3260 },
        { rank: 5, nickname: 'EmberCrow896', points: 3085, wins: 31, losses: 19, games: 50, apex: false, avatar: 'die:3:mg', peak: 3147 },
        { rank: 6, nickname: 'LunarFox118', points: 2397, wins: 28, losses: 22, games: 50, apex: false, avatar: 'die:6:violet', peak: 2467 },
        { rank: 7, nickname: 'OrbitHare662', points: 1863, wins: 24, losses: 20, games: 44, apex: false, avatar: 'die:1:cy', peak: 1983 },
        { rank: 8, nickname: 'GlitchRaven37', points: 1394, wins: 19, losses: 17, games: 36, apex: false, avatar: 'die:4:orange', peak: 1474 },
      ];
      const fixture = {
        profile,
        standing: isResult
          ? { points: 3200, rank: 4, population: 199, percentile: 0.9848484848 }
          : { points: 3200, rank: 4, population: 199, percentile: 0.9848484848 },
        ladder: isResult
          ? { points: 3200, peak: 3200, wins: 13, losses: 7, draws: 1 }
          : { points: 3200, peak: 3260, wins: 35, losses: 18, draws: 2 },
        board,
      };

      win.localStorage.setItem('sb-euzjcejbkxvqfrttgaxu-auth-token', JSON.stringify(session));
      win.localStorage.setItem(PROFILE_KEY, JSON.stringify(isResult ? {
        nickname: 'FrostLynx303', avatar: 'die:5:cy', rating: 3200, rank: 4, apex: false,
      } : {
        nickname: 'FrostLynx303', avatar: 'die:5:cy', rating: 3200, rank: 4, apex: false,
      }));

      const originalFetch = win.fetch.bind(win);
      win.fetch = async (input, init) => {
        const url = typeof input === 'string' ? input : input.url;
        if (!url.startsWith('https://euzjcejbkxvqfrttgaxu.supabase.co')) {
          return originalFetch(input, init);
        }
        const json = (body, status = 200) => new win.Response(JSON.stringify(body), {
          status,
          headers: { 'Content-Type': 'application/json' },
        });
        if (url.includes('/auth/v1/')) return json(session);
        if (url.includes('/rest/v1/rpc/active_ranked_curve_version')) return json(2);
        if (url.includes('/rest/v1/rpc/current_season')) return json('11111111-1111-4111-8111-111111111111');
        if (url.includes('/rest/v1/rpc/player_standing')) return json([fixture.standing]);
        if (url.includes('/rest/v1/rpc/player_card')) return json([{
          streak: 2,
          since: '2026-06-01T00:00:00Z',
          points: 3085,
          wins: 31,
          losses: 19,
          games: 50,
          rank: 5,
          apex: false,
          peak: 3147,
        }]);
        if (url.includes('/rest/v1/rpc/leaderboard_before')) return json([]);
        if (url.includes('/rest/v1/rpc/leaderboard')) return json(fixture.board);
        if (url.includes('/rest/v1/season_ratings')) return json([fixture.ladder]);
        if (url.includes('/rest/v1/player_ranked_features')) {
          return json([{ feature_id: 'equipped_runes' }]);
        }
        if (url.includes('/rest/v1/profiles')) return json([fixture.profile]);
        if (url.includes('/rest/v1/rpc/best_streak')) return json(7);
        if (url.includes('/rest/v1/rpc/match_history')) return json([]);
        throw new Error(`Unmocked capture request blocked: ${url}`);
      };
      return fixture;
    }

    function fitMarketingCopy() {
      const heading = document.getElementById('headline');
      const lines = [...heading.querySelectorAll('.headline-line')];
      const subhead = document.getElementById('subhead');
      const shell = document.querySelector('.screen-shell');
      const maximum = Math.round(parseFloat(getComputedStyle(heading).fontSize));
      const minimum = targetId === 'ipad-13' ? 78 : 70;
      const fits = () => lines.every((line) => line.scrollWidth <= heading.clientWidth + 1)
        && document.getElementById('eyebrow').scrollWidth <= document.querySelector('.copy').clientWidth + 1
        && subhead.scrollWidth <= subhead.clientWidth + 1
        && subhead.getBoundingClientRect().bottom <= shell.getBoundingClientRect().top - 32;
      for (let size = maximum; size >= minimum; size--) {
        heading.style.fontSize = `${size}px`;
        if (fits()) {
          document.body.dataset.headlineSize = String(size);
          return;
        }
      }
      throw new Error(`Localized marketing copy does not fit ${localeId}/${targetId}/${slide.slug}`);
    }

    function assertCaptureGeometry(win) {
      const shell = document.querySelector('.screen-shell').getBoundingClientRect();
      const lines = [...document.querySelectorAll('.headline-line')];
      if (window.innerWidth !== target.width || window.innerHeight !== target.height
          || document.documentElement.scrollWidth !== target.width
          || document.documentElement.scrollHeight !== target.height) {
        throw new Error(`Capture canvas is not exactly ${target.width}x${target.height}`);
      }
      if (win.innerWidth !== runtimeViewport.width || win.innerHeight !== runtimeViewport.height) {
        throw new Error(`Runtime viewport is ${win.innerWidth}x${win.innerHeight}; expected ${runtimeViewport.width}x${runtimeViewport.height}`);
      }
      if (win.document.documentElement.lang !== runtimeLanguageTag) {
        throw new Error(`Runtime language is ${win.document.documentElement.lang}; expected ${runtimeLanguageTag}`);
      }
      if (shell.left < 0 || shell.top < 0 || shell.right > target.width + 1 || shell.bottom > target.height + 1
          || lines.some((line) => line.scrollWidth > document.getElementById('headline').clientWidth + 1)) {
        throw new Error(`Localized capture geometry overflowed ${localeId}/${targetId}/${slide.slug}`);
      }
    }

    async function configure(win) {
      const k = await waitFor(() => win.__kb);
      const doc = win.document;
      const i18n = await win.eval("import('/src/i18n/index.ts')");
      i18n.setLanguageOverride(runtimeLocale);
      runtimeT = i18n.t;
      await waitFor(() => doc.documentElement.lang === runtimeLanguageTag);
      await doc.fonts.ready;
      const captureOverrides = doc.createElement('style');
      captureOverrides.id = 'app-store-capture-overrides';
      captureOverrides.textContent = `
        #btnLeave{display:none!important}
        #ovStart:not(.on),#ovPractice:not(.on),#ovOnline:not(.on),#ovEnd:not(.on){display:none!important}
      `;
      doc.head.appendChild(captureOverrides);
      applyNativeGeometry(win);

      if (slide.scene === 'rowmult') {
        startScene(k, {
          scoring: 2,
          mine: [[6, 5, 1], [6, 5, 3], [6]],
          theirs: [[2, 2], [5], [1, 4]],
          die: 4,
          opponent: 'EmberCrow896',
        });
        const multipliers = [...doc.querySelectorAll('#botRows .mx')]
          .filter((element) => element.textContent.trim());
        if (multipliers.length !== 2) throw new Error(`Expected two multiplied rows; saw ${multipliers.length}`);
        const multiplierLabels = multipliers.map((element) => element.textContent.replace(/\s/g, '')).sort();
        if (multiplierLabels.join(',') !== '×2,×3') {
          throw new Error(`Expected one ×2 row and one ×3 row; saw ${multiplierLabels.join(', ')}`);
        }
        const twoDiceRow = k.S.boards[1].map((column) => column[1]).filter(Number.isInteger);
        if (twoDiceRow.length !== 2 || twoDiceRow.some((value) => value !== 5)) {
          throw new Error(`Expected the ×2 row to contain only two fives; saw ${twoDiceRow.join(', ')}`);
        }
      } else if (slide.scene === 'dial') {
        const [{ reveal }, { modeById }, { hide }, { setReducedMotion }] = await win.eval(`Promise.all([
          import('/src/ui/reveal.ts'),
          import('/src/core/modes.ts'),
          import('/src/ui/dom.ts'),
          import('/src/ui/fx.ts')
        ])`);
        hide('#ovStart');
        hide('#ovPractice');
        setReducedMotion(true);
        win.setInterval = () => 0;
        void reveal({
          mode: modeById('colshield'),
          me: { name: 'FrostLynx303', rating: 2494, avatar: 'die:5:cy' },
          foe: { name: 'EmberCrow896', rating: 2468, avatar: 'die:3:mg' },
          peer: { announce() {}, onPeer() { return () => {}; } },
        });
        await waitFor(() => doc.querySelector('#ovWheel.landed.holding'));
        await waitFor(() => doc.querySelector('#wheelDial .dnode.on')?.dataset.mode === 'colshield');
        const answer = doc.getElementById('wheelName');
        await waitFor(() => win.getComputedStyle(answer).color === 'rgb(255, 209, 102)');
        document.body.dataset.dialColor = win.getComputedStyle(answer).color;
        k.fit();
      } else if (slide.scene === 'ward') {
        k.S.reducedMotion = false;
        doc.querySelector('#motionSeg button[data-rm="0"]')?.click();
        await waitFor(() => k.reduced === false && !doc.getElementById('kbroot').classList.contains('reduce-motion'));
        startScene(k, {
          scoring: 0,
          spell: 'ward',
          mine: [[5, 2], [4, 4], [6]],
          theirs: [[3, 3], [2], [5, 1]],
          die: 5,
          aiNormal: true,
        });
        await k.spells.cast('ward', 1);
        await waitFor(() => doc.querySelector('#botBoard .col[data-col="1"].warded'));
        await pause(1100);

        k.S.turn = 0;
        k.S.phase = 'choose';
        k.S.busy = false;
        k.S.die = 4;
        k.applySides();
        k.renderAll(false);
        k.setStageDie(4, 0);
        k.setStatus(runtimeT('game', 'status.aiThinking'), 0);
        k.showHints();
        k.spells.render();
        k.setActivePlate();
        const runtimeTimeouts = new Set();
        const nativeSetTimeout = win.setTimeout.bind(win);
        win.setTimeout = (callback, delay, ...args) => {
          const id = nativeSetTimeout(callback, delay, ...args);
          runtimeTimeouts.add(id);
          return id;
        };
        void k.place(0, 1);
        await waitFor(() => doc.querySelector('.ward-strike-ghost')
          && doc.querySelector('#botBoard .col[data-col="1"].sealsnap')
          && doc.querySelector('.wd.block'));

        const snapAnimations = new Set(['sealpop', 'sealsnapoff', 'sealunwind', 'sealburst', 'wdblock']);
        const deterministicLoops = new Set(['drift', 'hot', 'pulse', 'sealbreathe', 'sealrun', 'sealready']);
        for (const animation of doc.getAnimations({ subtree: true })) {
          const target = animation.effect?.target;
          const duration = Number(animation.effect?.getTiming().duration);
          const recoil = target?.classList?.contains('ward-strike-ghost')
            && animation.id === 'kb-spell-motion' && duration === 1024;
          const snap = snapAnimations.has(animation.animationName);
          const loop = deterministicLoops.has(animation.animationName);
          if (!recoil && !snap && !loop) continue;
          try {
            animation.currentTime = loop ? 0 : 192;
            animation.pause();
          } catch { /* a completed non-persistent animation needs no further hold */ }
        }
        for (const id of runtimeTimeouts) win.clearTimeout(id);
        win.setTimeout = nativeSetTimeout;
        await twoFrames(win);
        const wardMark = doc.querySelector('.wd.block');
        if (!wardMark || win.getComputedStyle(wardMark).color !== 'rgb(125, 255, 196)') {
          throw new Error('WARD seal did not retain its mint identity');
        }
        if (doc.querySelectorAll('.ward-strike-ghost.p2[data-v="4"]').length !== 1) {
          throw new Error('WARD strike-contact frame did not hold exactly one attacker ghost');
        }
        if (JSON.stringify(k.S.boards[1][1]) !== '[4,4]'
            || JSON.stringify(k.S.boards[0][1]) !== '[2,4]'
            || k.S.charm.wards[1][1] !== 0
            || doc.querySelector('#botBoard .col[data-col="1"] .dying')) {
          throw new Error('WARD strike-contact fixture did not preserve the protected pair');
        }
        if (doc.getElementById('tagTop').textContent.trim()
            !== runtimeT('game', 'difficulty.normal')) {
          throw new Error('WARD capture is not showing localized AI Normal');
        }
        k.fit();
      } else if (slide.scene === 'sunder') {
        startScene(k, {
          scoring: 0,
          spell: 'sunder',
          mine: [[6, 6], [3], [2]],
          theirs: [[4, 4], [5, 4], [1, 4]],
          die: 4,
          aiNormal: true,
        });
        await k.spells.cast('sunder', -1);
        await waitFor(() => doc.querySelectorAll('.sunder-doomed').length === 4);
        if (doc.getElementById('tagTop').textContent.trim()
            !== runtimeT('game', 'difficulty.normal')) {
          throw new Error('SUNDER capture is not showing localized AI Normal');
        }
        k.fit();
      } else if (slide.scene === 'bounty') {
        const activeTurn = captureVariant === 'active';
        startScene(k, {
          scoring: 5,
          spell: activeTurn ? 'ward' : '',
          mine: activeTurn ? [[6, 2, 4], [5], [3, 1]] : [[6, 2], [5], [3, 1]],
          theirs: activeTurn ? [[1], [2, 5], [1, 6]] : [[4, 4], [2, 5], [1, 6]],
          die: 4,
          opponent: 'EmberCrow896',
        });
        k.S.bounty = activeTurn ? [0, 2] : [0, 0];
        k.renderAll(false);
        if (activeTurn) {
          k.setStageDie(4, 1);
          if (!k.spells.arm('ward')) throw new Error('BOUNTY active-turn rune did not arm');
          const timer = doc.getElementById('timerWrap');
          timer.classList.add('on', 'warn');
          timer.style.setProperty('--tcbase', 'var(--p1)');
          doc.getElementById('timerBar').style.width = '40%';
          doc.getElementById('timerNum').textContent = '4';
          // The production arm turn finishes face-up and enlarged. Hold that
          // final pose so every source load captures the same card geometry.
          await pause(400);
          const rune = doc.querySelector('#spellBar .rune.armed[data-spell="ward"]:not([hidden])');
          const card = rune?.querySelector('.rune-charge.top:not([hidden])');
          const face = card?.querySelector('.rface');
          const back = card?.querySelector('.rback');
          if (doc.querySelectorAll('.bounty-mint').length !== 0
              || !rune || !card || !face || !back
              || Number(win.getComputedStyle(face).opacity) < .9
              || Number(win.getComputedStyle(back).opacity) > .1
              || win.getComputedStyle(card).transform === 'none'
              || doc.querySelector('#dieStage .die')?.dataset.v !== '4'
              || doc.getElementById('timerNum').textContent !== '4'
              || JSON.stringify(k.S.boards[1]) !== '[[6,2,4],[5],[3,1]]'
              || JSON.stringify(k.S.boards[0]) !== '[[1],[2,5],[1,6]]'
              || doc.getElementById('btyBot').textContent.trim() !== '✦2') {
            throw new Error('BOUNTY active-turn source is missing its armed rune, die, or countdown');
          }
        } else {
          void k.place(1, 0);
          await waitFor(() => doc.querySelectorAll('.bounty-mint.bounty-mint-static').length === 2);
          const frozenAt = win.performance.now();
          try {
            Object.defineProperty(win.performance, 'now', { configurable: true, value: () => frozenAt });
            win.setTimeout = () => 0;
          } catch { /* the authored reduced-motion hold still leaves 320ms */ }
          if (doc.querySelectorAll('.bounty-mint').length !== 2) {
            throw new Error('BOUNTY double strike did not hold exactly two coins');
          }
          if (doc.getElementById('timerWrap').classList.contains('on')
              || doc.getElementById('btyBot').textContent.trim() !== '✦0') {
            throw new Error('BOUNTY strike source leaked active-turn furniture');
          }
        }
        k.fit();
      } else if (slide.scene === 'ladder') {
        installOnlineFixture(win, 'ladder');
        hideMenus(doc);
        const online = await win.eval("import('/src/online/screens/ui.ts')");
        await online.openOnline('ladder', { startTutorial() {} });
        await waitFor(() => !doc.getElementById('onLadder')?.hidden);
        await waitFor(() => doc.querySelectorAll('#onLadderList .lrow').length >= 8);
        await waitFor(() => doc.querySelector('#onLadderList .lrow.me .nm')?.textContent === 'FrostLynx303');
        k.fit();
      }

      applyNativeGeometry(win);
      await twoFrames(win);
      // The overlays deliberately leave with a short opacity transition. The
      // final still must be a settled product frame, never two screens blended
      // together halfway through that transition.
      if (slide.scene !== 'bounty' || captureVariant === 'active') {
        await pause(slide.scene === 'dial' ? 140 : 500);
      }
      if (slide.scene === 'ward') {
        // fit()/ResizeObserver may rebuild the seal SVG after the first freeze.
        // Reapply the exact authored instant only after final geometry settles,
        // so independently loaded capture segments cannot sample two phases.
        const snapAnimations = new Set(['sealpop', 'sealsnapoff', 'sealunwind', 'sealburst', 'wdblock']);
        const deterministicLoops = new Set(['drift', 'hot', 'pulse', 'sealbreathe', 'sealrun', 'sealready']);
        for (const animation of doc.getAnimations({ subtree: true })) {
          const target = animation.effect?.target;
          const duration = Number(animation.effect?.getTiming().duration);
          const recoil = target?.classList?.contains('ward-strike-ghost')
            && animation.id === 'kb-spell-motion' && duration === 1024;
          const snap = snapAnimations.has(animation.animationName);
          const loop = deterministicLoops.has(animation.animationName);
          if (!recoil && !snap && !loop) continue;
          try {
            animation.currentTime = loop ? 0 : 192;
            animation.pause();
          } catch { /* a completed non-persistent animation needs no further hold */ }
        }
        await twoFrames(win);
      }

      const visibleOverlay = [...doc.querySelectorAll('.ov.on')].map((element) => element.id);
      if (!doc.getElementById('app') || !doc.getElementById('kbroot')) {
        throw new Error('Production application root is missing');
      }
      if (win.getComputedStyle(doc.getElementById('btnLeave')).display !== 'none') {
        throw new Error('The in-game exit button is visible in a store preview');
      }
      const expectedOverlay = slide.scene === 'dial' ? 'ovWheel'
        : slide.scene === 'ladder' ? 'ovOnline'
        : null;
      if (visibleOverlay.some((id) => id !== expectedOverlay)) {
        throw new Error(`Unexpected overlay: ${visibleOverlay.join(', ')}`);
      }

      await document.fonts.ready;
      fitMarketingCopy();
      assertCaptureGeometry(win);
      document.body.dataset.slide = String(slideNumber);
      document.body.dataset.slug = slide.slug;
      document.body.dataset.variant = captureVariant;
      document.body.dataset.locale = localeId;
      document.body.dataset.runtimeLocale = runtimeLocale;
      document.body.dataset.target = targetId;
      document.body.dataset.runtimeViewport = `${runtimeViewport.width}x${runtimeViewport.height}`;
      document.title = `${String(slideNumber).padStart(2, '0')} / ${String(manifest.slides.length).padStart(2, '0')} — ${localeId} — ${targetId} — ${slide.slug}${captureVariant === 'hero' ? '' : ` — ${captureVariant}`}`;
      window.scrollTo(0, 0);
      document.body.scrollTo(0, 0);
      document.body.dataset.ready = '1';
    }

    frame.addEventListener('load', () => {
      configure(frame.contentWindow).catch(failSource);
    }, { once: true });
  </script>
</body>
</html>
