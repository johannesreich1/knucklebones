<!-- meta name="LD8 — Duel clash" group="3c · Loading" subtitle="Cyan and magenta lean in and clash, a spark at the meeting point — made for every wait that ends in an opponent: matchmaking, face-off sheets, rejoining a live match" width=412 height=780 links="Matchmaking" -->
<style>
  .ldwrap{display:flex;flex-direction:column;align-items:center;gap:26px;margin:auto 0;padding:10px 0}
  .ldpanel{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:var(--w-col);
    margin:0 auto;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:30px 16px 24px}
  .ldcap{font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;text-align:center}

  /* the duel: both dice idle-bob out of phase, lean in together, CLASH at the
     centre — one spark, a shared flinch — and drift back. The spark is white
     because a collision of cyan and magenta light shouldn't take sides. */
  .lddue{position:relative;display:flex;align-items:center;gap:34px}
  .lddue .vs{font-size:10px;font-weight:900;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
  .lddue .die{animation:ldlean 2.4s ease-in-out infinite}
  .lddue .die:nth-child(3){animation-name:ldlean2}
  @keyframes ldlean{0%,14%{transform:translateX(0) rotate(-3deg)}
    38%{transform:translateX(26px) rotate(9deg)}46%{transform:translateX(20px) rotate(6deg)}
    62%,100%{transform:translateX(0) rotate(-3deg)}}
  @keyframes ldlean2{0%,14%{transform:translateX(0) rotate(3deg)}
    38%{transform:translateX(-26px) rotate(-9deg)}46%{transform:translateX(-20px) rotate(-6deg)}
    62%,100%{transform:translateX(0) rotate(3deg)}}
  .ldspark{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.5) 30%,transparent 70%);
    opacity:0;animation:ldspark 2.4s ease-out infinite}
  @keyframes ldspark{0%,36%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1)}
    54%{opacity:0;transform:scale(1.7)}100%{opacity:0}}

  /* context: the face-off sheet, opponent half still unknown */
  .ldsheet{width:100%;max-width:var(--w-col);margin:0 auto;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:flex;
    flex-direction:column;align-items:center;gap:10px}
  .ldwho{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:900;letter-spacing:.1em}
  .ldwho .me{color:var(--cy)}
  .ldwho .them{color:var(--dim);animation:ldskel 1.6s ease-in-out infinite}
  @keyframes ldskel{0%,100%{opacity:.5}50%{opacity:1}}
  .ldnote{font-size:8.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
    text-align:center;opacity:.8}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><button class="ico">‹</button><span class="ttl">LOADING</span><span class="pad"></span></div>
  <div class="ldwrap">
    <div class="ldpanel">
      <div class="lbl">Matchmaking · Face-off · Rejoin</div>
      <div class="lddue">{{die:4:p1:48}}<span class="vs">vs</span>{{die:4:p2:48}}<div class="ldspark"></div></div>
      <div class="ldcap">Finding your opponent</div>
    </div>
    <div class="ldsheet">
      <div class="lddue">{{die:2:p1:30}}<span class="vs">vs</span>{{die:2:p2:30}}<div class="ldspark"></div></div>
      <div class="ldwho"><span class="me">QuietBadger871</span><span class="vs">·</span><span class="them">— — —</span></div>
    </div>
    <div class="ldnote">2.4s round · the clash lands on the beat, the spark takes nobody's colour · only for waits that end in an opponent</div>
  </div>
</div></div>
