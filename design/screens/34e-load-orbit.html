<!-- meta name="LD5 — Orbit" group="3c · Loading studies" subtitle="Three loose pips circle an empty die and the face keeps almost landing — the roll is being decided; made for a profile or face-off sheet still fetching its player" width=412 height=780 links="Leaderboard" -->
<style>
  .ldwrap{display:flex;flex-direction:column;align-items:center;gap:26px;margin:auto 0;padding:10px 0}
  .ldpanel{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:var(--w-col);
    margin:0 auto;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:30px 16px 24px}
  .ldcap{font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;text-align:center}

  /* the orbit: the shell's own pips live on a 2.8s beat — dark while the
     satellites circle, flashing ON (the face lands) as the satellites dim.
     Satellites are the pip's twin: same radial fill, same glow. */
  .ldorb{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
  .ldorb .pip{opacity:0;transform:scale(.3);transition:none;animation:ldland 2.8s ease-in-out infinite}
  @keyframes ldland{0%,54%{opacity:0;transform:scale(.3)}64%,82%{opacity:1;transform:scale(1)}
    94%,100%{opacity:0;transform:scale(.3)}}
  .ldring{position:absolute;inset:0;animation:ldspin 2.8s linear infinite}
  .ldring i{position:absolute;top:0;left:50%;width:11px;height:11px;margin-left:-5px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--cy) 78%);
    box-shadow:0 0 6px rgba(40,232,255,.85),0 0 14px rgba(40,232,255,.45);
    animation:ldsat 2.8s ease-in-out infinite}
  .ldring i:nth-child(2){top:auto;bottom:14px;left:12px;margin:0}
  .ldring i:nth-child(3){top:auto;bottom:14px;right:12px;left:auto;margin:0}
  @keyframes ldspin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  @keyframes ldsat{0%,50%{opacity:1}64%,82%{opacity:.12}96%,100%{opacity:1}}

  /* context: the face-off sheet before its player answers */
  .ldsheet{width:100%;max-width:var(--w-col);margin:0 auto;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:flex;
    align-items:center;gap:14px}
  .ldskel{height:10px;border-radius:6px;background:rgba(255,255,255,.07);
    animation:ldskel 1.6s ease-in-out infinite}
  .ldskel.w1{width:44%}.ldskel.w2{width:64%}
  @keyframes ldskel{0%,100%{opacity:.55}50%{opacity:1}}
  .ldcolumn{display:flex;flex-direction:column;gap:10px;flex:1}
  .ldnote{font-size:8.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
    text-align:center;opacity:.8}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><button class="ico">‹</button><span class="ttl">LOADING</span><span class="pad"></span></div>
  <div class="ldwrap">
    <div class="ldpanel">
      <div class="lbl">Profile · Face-off · Modal</div>
      <div class="ldorb">
        <div class="ldring"><i></i><i></i><i></i></div>
        {{die:3:p1:64}}
      </div>
      <div class="ldcap">Loading player</div>
    </div>
    <div class="ldsheet">
      <div class="ldorb" style="width:64px;height:64px"><div class="ldring"><i></i><i></i><i></i></div>{{die:3:p2:40}}</div>
      <div class="ldcolumn"><span class="ldskel w2"></span><span class="ldskel w1"></span></div>
    </div>
    <div class="ldnote">2.8s beat · satellites circle, the face lands, scatters again · the die never fills for real until the data does</div>
  </div>
</div></div>
