<!-- meta name="Home — signed in" group="1 · Home" subtitle="Online-first: the duel is the hero, one tap to ranked" width=412 height=980 links="Matchmaking, Ladder, Settings, Profile, Practice offline" -->
<style>
  /* every visual comes from the app's own HOME CSS (src/styles/main.css);
     this is preview glue only — the real overlay top-anchors and pins for us */
  .scr{align-items:center}
  .hero{margin-top:34px}
  .viewfoot{margin-top:auto;padding-top:20px}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="hero">
    {{splitmark:96}}
    <div class="eyebrow">Neon Edition</div>
    <h1>KNUCKLEBONES</h1>
    <div class="sub2">Dice duels</div>
  </div>

  <div class="homestack">
    <!-- the plate IS the account door (design 13d): the profile's ring at chip
         size, docked on the button that moves it -->
    <button class="pplate dice-static">
      <span class="ringwrap mini" style="--p:.489"><i class="lring"></i><span class="pav">{{die:5:p1:18}}</span></span>
      <span class="nm2">FrostLynx303</span>
      <span class="meta2"><span class="mrow"><b>2,494</b></span><span class="gpill" style="--gc:var(--g-gold)">GOLD · #4</span></span>
      <span class="chev">›</span>
    </button>
    <button class="btn primary play-cta"><span class="btn-leading-icon" data-icon="play" aria-hidden="true">{{ico:play:25}}</span><span class="btn-label">Play ranked match</span></button>
    <div class="hrow">
      <button class="btn">Ladder</button>
      <button class="btn">Settings</button>
    </div>
  </div>

  <div class="quiet">
    <div class="cap">Practice offline</div>
    <div class="hrow">
      <button class="btn">VS AI</button>
      <button class="btn">2 players</button>
      <button class="btn">How to play</button>
    </div>
  </div>

  <div class="viewfoot">
    <button class="linkbtn">Impressum</button>
    <button class="linkbtn">Privacy</button>
    </div>
</div></div>
