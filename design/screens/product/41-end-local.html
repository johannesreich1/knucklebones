<!-- meta name="Offline — game over" group="4 · Local play" subtitle="Two actions: play again, or back to the setup — no rating, ever" width=412 height=880 links="Offline, Home" -->
<style>
  /* verdict up top, scores centred, actions in the thumb zone.
     The verdict, the scoreline and the buttons are the APP's own elements
     (#endTitle, .scoreline, .btn) so their look arrives from main.css. Only
     the handful of rules the app scopes to #ovEnd — which the preview stage
     is not — are restated below, and nothing else. */
  .rwrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin:0;flex:1;
    padding-top:16px;width:100%;max-width:var(--w-col);align-self:center}
  .rwrap .scoreline{margin-top:auto}            /* app: #ovEnd .scoreline */
  .rwrap .btn:first-of-type{margin-top:auto}    /* app: #ovEnd #btnAgain */
  .rwrap .btn{width:100%;max-width:var(--w-col);min-width:0}   /* app: #ovEnd .btn */
  /* the two sizes the result screen scales up to (app: --verdict) */
  #endTitle{font-size:clamp(34px,11.5vw,54px);padding-inline-start:.2em}
  .rwrap .scoreline .you,.rwrap .scoreline .cpu{font-size:clamp(34px,11vw,46px)}
  /* The gradient and — crucially — `filter:none` come from #endTitle itself.
     Never re-add a drop-shadow here: an element that clips its background to
     text AND takes a filter is the pair Safari drops the clip on, painting a
     hard-edged gradient box behind the word. This card carried one for a year. */
  /* .ov .sub restated: the preview has no .ov ancestor to inherit it from */
  .rsub{font-size:11.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
    margin-top:-8px;text-align:center}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="rwrap">
    <div class="titlewrap"><h1 id="endTitle" class="win">VICTORY</h1></div>
    <div class="rsub">You out-rolled the machine</div>
    <div class="scoreline">
      <span class="sc"><span class="you">41</span><em>You</em></span>
      <span class="vs">VS</span>
      <span class="sc"><span class="cpu">33</span><em>AI</em></span>
    </div>
    <button class="btn primary play-cta"><span class="btn-leading-icon" data-icon="play" aria-hidden="true">{{ico:play:25}}</span><span class="btn-label">Next duel</span></button>
    <!-- a real secondary button, not a text link, and the SHORT cut: a way out
         must not stand as tall as NEXT DUEL. Three buttons stood here until
         2026-08-22 (Next duel / Change difficulty / Home) — the setup screen's
         ‹ is the way home, so the two secondaries were one tap apart. -->
    <button class="btn small">Change setup</button>
  </div>
</div></div>
