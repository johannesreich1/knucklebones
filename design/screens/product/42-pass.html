<!-- meta name="Pass the phone" group="4 · Local play" subtitle="Hand-off between local turns — the one screen that keeps a ✕, and it leaves at once where the HUD's door asks first" width=412 height=880 links="Game (local)" -->
<style>
  /* This screen is drawn ENTIRELY by the app: the stage wears #ovPass, so the
     glow, the swap ring, the name, the hint, the totals and the tap line all
     arrive from main.css's own rules. The card used to keep a private copy of
     all six, and four of them had drifted (the tap line alone was 10px dim
     where the app ships 13px bold in --txt). A copy is finished once and
     maintained twice; this way a change in main.css re-draws the card. */
  /* .ov centres its column and the preview stage is a plain flex box —
     the one thing left for the card to say. */
  .scr{align-items:center;justify-content:center}
</style>
<!-- --pc is set INLINE at hand-off (flow/game.ts: ov.style.setProperty('--pc',
     colorOf(who))) and has no CSS default anywhere, so a card that omits it
     loses the whole point of the screen: the name, the ring and the wash all
     fall back to grey. Player 2 is next here, and colorOf(AI) is var(--p2) —
     the duel pair, never a raw hue, because Settings repoints both sides. -->
<div class="stage"><div class="bgfx"></div><div class="scr" id="ovPass" style="--pc:var(--p2)">
  <div class="glow"></div>
  <div class="swapicon">⇅</div>
  <div class="who">PLAYER 2</div>
  <div class="hint">Pass the phone</div>
  <div class="mini"><b class="a">12</b><span>—</span><b class="b">8</b></div>
  <div class="tapline">Tap anywhere when ready</div>
  <button class="ico" id="passQuit">✕</button>
</div></div>
