<style>
  /* .shead is the app's shared header (src/styles/main.css) — card adds spacing only */
  .shead{margin-bottom:10px}
  /* Stands in for .pbody (main.css), which the preview cannot wear: its
     negative top margin and header-height padding assume the real pinned
     header. Same 20px gap and centring — and NO width of its own: every row is
     an app `.card`, so the column is --w-col wherever it is drawn. This used to
     carry a private max-width:300px, which is narrower than one row of hue
     swatches (6×44px + 5×9px gap = 309px): the strip wrapped to two rows in
     the preview and one in the app. */
  .swrap{display:flex;flex-direction:column;align-items:center;gap:20px;
    width:100%;flex:1;margin-top:14px}
  .viewfoot{padding-top:20px}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><button class="ico page-back" data-page-back>{{ico:back:30}}</button><span class="ttl">SETTINGS</span><span class="pad"></span></div>
  <div class="swrap">
    <div class="card">
      <div class="lbl">Sound</div>
      <div class="seg"><button class="on">ON</button><button>OFF</button></div>

    <div class="card">

      <div class="seg"><button>NUMBERS</button><button class="on">PIPS</button></div>
    </div>
    <!-- THE DUEL PAIR, at its cyan-vs-magenta default. A colour belongs to one
         player only, so each strip renders the other side's pick DISABLED
         (flow/menu.ts syncPick) — that lock is the thing the picture has to
         show, not the swatches. The seven are a hand-copy of DUELHUES
         (src/state.ts): design/build.mjs has no hue-strip token to render them

    <div class="card">
      <div class="lbl">Your colour</div>
      <div class="hues">
        <button class="on" style="--h:var(--cy)" aria-label="CYAN"></button>

        <button style="--h:var(--gold)" aria-label="GOLD"></button>
        <button style="--h:var(--green)" aria-label="GREEN"></button>
        <button style="--h:var(--violet)" aria-label="VIOLET"></button>
        <button style="--h:var(--orange)" aria-label="ORANGE"></button>
        <button style="--h:var(--blue)" aria-label="BLUE"></button>
      </div>
    </div>
    <div class="card">
      <div class="lbl">Opponent colour</div>
      <div class="hues">
        <button disabled style="--h:var(--cy)" aria-label="CYAN"></button>
        <button class="on" style="--h:var(--mg)" aria-label="MAGENTA"></button>
        <button style="--h:var(--gold)" aria-label="GOLD"></button>
        <button style="--h:var(--green)" aria-label="GREEN"></button>
        <button style="--h:var(--violet)" aria-label="VIOLET"></button>

      </div>

    <div class="card">
