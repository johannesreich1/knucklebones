<!-- meta name="Quit / forfeit" group="5 · Settings & sheets" subtitle="The HUD's one control opens the shared draggable sheet: restart or quit offline, forfeit ranked, and Keep playing always leads" width=412 height=841 links="Home" -->
<style>
  /* the sheet and ask-card are the app's own components (src/styles/main.css).
     This card shows both rosters side by side, which is the point: one shared
     draggable frame, two sets of words — and one emphasis rule
     (ui/askcard.ts, spec.loud): the
     ENCOURAGED answer LEADS at full size wearing the duel gradient. Offline's
     two alternatives follow at the same small, quiet size; ranked needs only
     its destructive alternative. */
  .scr{gap:26px;justify-content:center}
  /* the caption itself comes from the preview chrome (design/build.mjs); only
     the pull-up that tucks it against its ask-card is this card's own */
  .cap2{margin-bottom:-14px}
  /* Flatten only the full-screen positioning so both examples can share one
     study. The runtime class chain stays intact: .faceoff.fointeractive owns
     the 22px card gap, full-width grabber, 356px cap and shared frame. */
  .scr>.faceoff{position:relative;inset:auto;z-index:auto;width:100%;padding:14px;background:transparent}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">

  <div class="cap2">OFFLINE — NOTHING RATED IS AT STAKE</div>
  <div class="faceoff fointeractive focarddrag asksheet">
    <div class="focard">
      <button class="fograb" aria-label="Close"><span class="fobar"></span></button>
      <div class="askcard">
        <div class="fh">Quit this duel?</div>
        <p class="fp">The board is lost — offline duels are quick, and this one ends here.</p>
        <button class="btn primary">Keep playing</button>
        <button class="btn soft small">Restart duel</button>
        <button class="btn soft small">Quit duel</button>
      </div>
    </div>
  </div>

  <div class="cap2">RANKED — LEAVING COSTS POINTS</div>
  <div class="faceoff fointeractive focarddrag asksheet">
    <div class="focard">
      <button class="fograb" aria-label="Close"><span class="fobar"></span></button>
      <div class="askcard">
        <div class="fh">Forfeit this match?</div>
        <p class="fp">Leaving a ranked match loses it, and the points go with it.</p>
        <button class="btn primary">Keep playing</button>
        <button class="btn soft small">Forfeit</button>
      </div>
    </div>
  </div>

</div></div>
