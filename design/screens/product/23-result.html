<!-- meta name="Match result" group="2 · Online flow" subtitle="Victory with the identity plates (design 36f): the group pills carry both ranks, your delta beside the number it changed, the beaten foe stamped — and tappable, opening the face-off" width=412 height=920 links="Matchmaking, Home, Profile" -->
<style>
  /* verdict up top, the duel centred, actions in the thumb zone. The plates
     (.endplates/.pplate/.pstamp/.pdelta) are WORN from main.css — the app's
     own result rows, not a copy. */
  /* ONE cap for the column, the app's own token: #ovEnd gives .btn and
     .endplates the same --w-col (main.css), so on any phone the buttons and
     the plates share an edge. Two hand-picked numbers used to sit here
     (320 on the wrap, 300 on the buttons) and the action stack rendered 10px
     inside the plates above it — a misalignment the shipped screen cannot
     produce at any width. */
  .rwrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin:0;flex:1;
    padding-top:16px;width:100%;max-width:var(--w-col);align-self:center}
  .rwrap .rline{margin-top:auto}
  .rwrap .btn.primary{margin-top:auto}
  .rwrap .btn{width:100%;max-width:var(--w-col);min-width:0}
  .rtitle{font-size:38px;letter-spacing:.2em;font-weight:900;
    background-image:linear-gradient(100deg,#28e8ff,#fff 50%,#8dffcf);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  /* The verdict's glow is a BLOOM LAYER under the word, never a filter on the
     word: main.css pins `#endTitle{filter:none}` and paints the glow with
     `#ovEnd .titlewrap::before` — a wash about nine times the type size, not a
     ring around the letters. This card wears the app's .titlewrap, but that
     rule is scoped to the #ovEnd overlay a card body has no way to be inside,
     so the geometry is restated here. It still derives from --verdict, so it
     stays proportional the way the app's does, and it replays the app's own
     @keyframes endBloom. What was here before was drop-shadow(0 0 26px …) on
     .rtitle itself: the wrong shape, on the element the app keeps clean. */
  .vbloom{--verdict:38px;--bloom:rgba(40,232,255,.40)}
  .vbloom::before{content:"";position:absolute;left:50%;top:50%;z-index:-1;
    width:min(160%,calc(var(--verdict) * 9));height:calc(var(--verdict) * 3.4);
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(closest-side,var(--bloom,transparent),transparent 74%);
    filter:blur(calc(var(--verdict) * .55));
    animation:endBloom 1.5s cubic-bezier(.2,.8,.3,1) .35s both}
  .rsub{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:-8px}
  /* the plates carry the names — the scoreline is pure numbers.
     NEITHER number is dimmed: main.css .scoreline .you/.cpu are identical but
     for the hue, and nothing outcome-scoped reaches them (the only #ovEnd.win
     rules are the bloom and the title animations). The loser's 30 used to wear
     opacity:.75 and a weakened 12px/.4 glow here — an invention on top of the
     plate dim (.pplate.lostp), which is where the app says who lost. */
  .rline{display:flex;align-items:baseline;justify-content:center;gap:16px;font-weight:900}
  .rline .you{color:var(--cy);font-size:44px;text-shadow:0 0 14px rgba(40,232,255,.5)}
  .rline .vs{color:var(--dim);font-size:12px;letter-spacing:.2em;font-weight:800}
  .rline .cpu{color:var(--mg);font-size:44px;text-shadow:0 0 14px rgba(255,47,160,.5)}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="rwrap">
    <div class="titlewrap vbloom"><div class="rtitle">VICTORY</div></div>
    <div class="rsub">You out-rolled EmberCrow896</div>
    <div class="rline">
      <span class="you">47</span><span class="vs">VS</span><span class="cpu">30</span>
    </div>
    <div class="endplates dice-static">
      <!-- the delta is what THIS pairing paid, so it has to be a number
           core/ladder.ts can actually return: delta(2427, 2493, win) = +83 and
           the foe's loss is -62, which is how 2,510 and 2,431 close. A win is
           floored at MIN_GAIN (30) — "a win is never worth nothing" — so the
           +16 that used to sit here was a payout no victory can produce. -->
      <button class="pplate lg wonp">
        <span class="ringwrap mini" style="--p:.502"><i class="lring"></i>{{die:5:p1:18}}</span>
        <span class="nm2">FrostLynx303</span>
        <span class="meta2"><span class="mrow"><span class="pdelta">+83</span><b>2,510</b></span><span class="gpill" style="--gc:var(--g-gold)">GOLD · #3</span></span>
        <span class="chev">›</span>
      </button>
      <!-- .stamped rides WITH the stamp: ui/plate.ts sets the two together, and
           main.css hangs the jolt on .stamped, timed to the slam's contact.
           This markup was cloned from the slam study, which carried the jolt on
           a class of its own — dropping that class without picking up the
           shipped one left the foe's row taking no hit at all. -->
      <button class="pplate lg theirs lostp stamped">
        <span class="ringwrap mini" style="--p:.436"><i class="lring"></i>{{die:3:p2:18}}</span>
        <span class="nm2">EmberCrow896</span>
        <span class="pstamp">Beaten</span>
        <span class="meta2"><span class="mrow"><b>2,431</b></span><span class="gpill" style="--gc:var(--g-gold)">GOLD · #5</span></span>
        <span class="chev">›</span>
      </button>
    </div>
    <button class="linkbtn">Share result</button>
    <button class="btn primary play-cta"><span class="btn-leading-icon" data-icon="play" aria-hidden="true">{{ico:play:25}}</span><span class="btn-label">Next duel</span></button>
    <button class="btn small">Home</button>
  </div>
</div></div>
