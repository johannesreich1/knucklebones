<!-- meta name="Home — signed out" group="1 · Home" subtitle="Same hero; Play online leads through sign-in first" width=412 height=980 links="Sign in, Local play" -->
<style>
  .idchip{align-self:flex-end;font-size:10px;letter-spacing:.12em;color:var(--dim);
    border:1px dashed rgba(255,255,255,.18);border-radius:99px;padding:5px 11px}
  .hero{display:flex;flex-direction:column;align-items:center;gap:4px;margin:26px 0 8px}
  .hero .ttl{font-size:23px;letter-spacing:.24em;font-weight:900;
    background:linear-gradient(100deg,var(--cy),#fff 50%,var(--mg));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .eyebrow{font-size:9px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
  .duel{display:flex;align-items:center;gap:18px;margin:22px 0 6px}
  .duel .die.p1{transform:rotate(-9deg)}
  .duel .die.p2{transform:rotate(9deg)}
  .duel .vs{font-size:19px;font-weight:900;color:var(--gold);font-style:italic;
    text-shadow:0 0 18px rgba(255,209,102,.65)}
  .sub2{font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;
    text-align:center;margin-bottom:18px}
  .stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin:0 auto}
  .hint{font-size:10px;letter-spacing:.14em;color:var(--dim);text-align:center}
  .quiet{margin-top:22px;display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px;
    margin-left:auto;margin-right:auto}
  .quiet .cap{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.3em;
    color:var(--dim);text-transform:uppercase}
  .quiet .cap::before,.quiet .cap::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent)}
  .quiet .row{display:flex;gap:8px}
  .quiet .row .btn{flex:1;min-width:0;padding:10px 6px;font-size:10px;letter-spacing:.1em;
    background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.09);color:var(--dim)}
  .foot{margin-top:auto;display:flex;justify-content:center;gap:14px;padding-top:20px}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="idchip">Not signed in</div>

  <div class="hero">
    <div class="eyebrow">Neon Edition</div>
    <div class="ttl">KNUCKLEBONES</div>
    <div class="duel dice-static">
      {{die:5:p1:74}}
      <span class="vs">VS</span>
      {{die:3:p2:74}}
    </div>
    <div class="sub2">Ranked dice duels</div>
  </div>

  <div class="stack">
    <button class="btn primary">Play online</button>
    <div class="hint">Sign in to play ranked — takes a minute</div>
  </div>

  <div class="quiet">
    <div class="cap">Practice offline</div>
    <div class="row">
      <button class="btn">VS CPU</button>
      <button class="btn">2 players</button>
      <button class="btn">Tutorial</button>
    </div>
  </div>

  <div class="foot">
    <span class="tiny">How to play</span>
    <span class="tiny" style="opacity:.55">build dev</span>
  </div>
</div></div>
