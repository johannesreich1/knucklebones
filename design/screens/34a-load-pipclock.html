<!-- meta name="LD1 — Pip clock" group="3c · Loading" subtitle="The die face IS the spinner: eight pips chase the rim while the heart keeps the beat — one die, no new shapes, small enough for any modal" width=412 height=780 links="Ladder, Matchmaking" -->
<style>
  .ldwrap{display:flex;flex-direction:column;align-items:center;gap:26px;margin:auto 0;padding:10px 0}
  .ldpanel{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:var(--w-col);
    margin:0 auto;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:26px 16px}
  .ldcap{font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;text-align:center}

  /* the clock: all nine pips forced visible, the eight rim pips dim in a
     clockwise chase (grid cells 0 1 2 5 8 7 6 3), the centre breathes */
  .ldclock .pip{opacity:1;transform:scale(1);transition:none;animation:ldchase 1.28s linear infinite}
  .ldclock .pip:nth-child(1){animation-delay:0s}
  .ldclock .pip:nth-child(2){animation-delay:.16s}
  .ldclock .pip:nth-child(3){animation-delay:.32s}
  .ldclock .pip:nth-child(6){animation-delay:.48s}
  .ldclock .pip:nth-child(9){animation-delay:.64s}
  .ldclock .pip:nth-child(8){animation-delay:.8s}
  .ldclock .pip:nth-child(7){animation-delay:.96s}
  .ldclock .pip:nth-child(4){animation-delay:1.12s}
  .ldclock .pip:nth-child(5){animation:ldheart 1.28s ease-in-out infinite}
  @keyframes ldchase{0%{opacity:1;transform:scale(1.06)}14%{opacity:1}42%{opacity:.14;transform:scale(.8)}
    86%{opacity:.14;transform:scale(.8)}100%{opacity:1;transform:scale(1.06)}}
  @keyframes ldheart{0%,100%{opacity:.9;transform:scale(.92)}50%{opacity:.45;transform:scale(.72)}}

  /* context: a user-info sheet still fetching — the same die at 40px carries
     the wait, the rows are skeletons */
  .ldsheet{width:100%;max-width:var(--w-col);margin:0 auto;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:flex;
    flex-direction:column;gap:12px}
  .ldrow{display:flex;align-items:center;gap:12px}
  .ldskel{height:10px;border-radius:6px;background:rgba(255,255,255,.07);
    animation:ldskel 1.6s ease-in-out infinite}
  .ldskel.w1{width:38%}.ldskel.w2{width:62%}.ldskel.w3{width:50%}
  @keyframes ldskel{0%,100%{opacity:.55}50%{opacity:1}}
  .ldnote{font-size:8.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
    text-align:center;opacity:.8}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><button class="ico">‹</button><span class="ttl">LOADING</span><span class="pad"></span></div>
  <div class="ldwrap">
    <div class="ldpanel">
      <div class="lbl">Page wait · Modal · Inline</div>
      <div class="ldclock">{{die:6:p1:72}}</div>
      <div class="ldcap">Loading</div>
    </div>
    <div class="ldsheet">
      <div class="ldrow"><div class="ldclock">{{die:6:p1:36}}</div><span class="ldskel w2"></span></div>
      <div class="ldrow"><span class="ldskel w1"></span><span class="ldskel w3"></span></div>
      <div class="ldrow"><span class="ldskel w3"></span><span class="ldskel w1"></span></div>
    </div>
    <div class="ldnote">1.28s loop · pips only — no new geometry · scales 24px to 96px unchanged</div>
  </div>
</div></div>
