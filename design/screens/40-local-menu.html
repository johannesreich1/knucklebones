<style>
  .back{align-self:flex-start;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  .pwrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin:10px auto 0}
  .pwrap h2{margin:0;font-size:18px;letter-spacing:.22em;font-weight:900;text-align:center;
    background:linear-gradient(100deg,var(--cy),#fff 50%,var(--mg));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .pwrap .seg{display:flex;gap:8px}
  .pwrap .seg button{flex:1;padding:11px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);color:var(--dim);font-size:11px;font-weight:800;
    letter-spacing:.12em;font-family:inherit}
  .pwrap .seg button.on{color:#04101a;background:linear-gradient(100deg,var(--cy),#8fe0ff);
    border-color:transparent;box-shadow:0 6px 18px rgba(40,232,255,.3)}
  .tut-tease{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin-top:6px}
  .tut-tease .tx{display:flex;flex-direction:column;gap:2px}
  .tut-tease .t1{font-size:11.5px;font-weight:800;letter-spacing:.1em}
  .tut-tease .t2{font-size:9.5px;letter-spacing:.1em;color:var(--dim)}

<div class="stage"><div class="bgfx"></div><div class="scr">
  <span class="back">‹ Home</span>
  <div class="pwrap">
    <h2>PRACTICE</h2>
    <div class="lbl">Mode</div>
    <div class="seg"><button class="on">VS CPU</button><button>2 PLAYERS</button></div>
    <div class="lbl">CPU level</div>
    <div class="seg"><button>EASY</button><button>NORMAL</button><button class="on">HARD</button></div>
    <button class="btn primary" style="margin-top:8px">Play</button>
    <div class="tut-tease dice-static">
      {{die:4:gold:36}}
      <span class="tx"><span class="t1">TUTORIAL</span><span class="t2">A guided first game — five minutes</span></span>
    </div>
    <div class="tiny" style="text-align:center;margin-top:4px">Practice never touches your online rating</div>
  </div>
</div></div>
