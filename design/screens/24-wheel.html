<!-- meta name="Mode dial — landed" group="2 · Online flow" subtitle="The comet has stopped: the found mode is lit on the ring, blooming in the centre, and named below" width=412 height=880 links="Match" -->
<style>
  /* dial classes are the app's own (main.css) and the ring itself comes from
     the app's own generator (the dialnodes token → ui/modedial.ts), so this card
     cannot show a dial the app does not build. Glue only below.
     --dial is viewport-relative in the app — pinned here so the card's stage,
     not the browser window, decides the size. */
  .scr{align-items:center;justify-content:center;gap:12px}
  #ovWheel{--dial:252px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .wblurb{max-width:250px}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div id="ovWheel" class="landed">
    <div class="dwho">Opponent <b>EmberCrow896</b> · <span class="rt">1032</span></div>
    <div class="wtitle">GAME MODE</div>
    <div class="dial">
      <i class="dring"></i>
      <i class="dcomet" style="transform:rotate(154.29deg)"><i class="dtrail"></i><i class="dhead"></i></i>
      {{dialnodes:colshield}}
      <div class="dcore"><i class="dsonar"></i><i class="dfound" style="color:{{mhue:colshield}}">{{mico:colshield:40}}</i></div>
    </div>
    <div class="wname" style="color:{{mhue:colshield}}">{{mico:colshield:17}} COLUMN SHIELD</div>
    <div class="wblurb">A full column cannot be destroyed.</div>
    <div class="dhold"><b>5</b><span>Tap when you are ready</span></div>
  </div>
</div></div>
