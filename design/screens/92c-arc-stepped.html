<!-- meta name="C3 — Stepped tiers" group="9 · Profile · C refined" subtitle="The whole tier ladder is the element: three division segments in the arc, and the tiers you have cleared stay lit below" width=412 height=1020 links="Match history, Ladder" -->
<style>
  /* (.stepv, not .pts — the app's .pts is position:absolute and would yank
     every tier's number to the corner.)
     The arc is drawn as THREE discrete segments rather than one sweep, because
     the divisions are what the player actually chases — one fills every ~25
     games at an even win rate. The tier rail below is the second new element:
     it shows the whole climb, with the floor you cannot fall back through. */
  .shead{margin-bottom:4px}
  .pane{display:flex;flex-direction:column;gap:14px;width:100%;max-width:var(--w-col);
    margin:0 auto;align-items:center}
  .arcwrap{position:relative;width:214px;height:214px;display:grid;place-items:center}
  /* --d1..--d3 are each division's fill, 0..1 — three 84deg segments with 6deg gaps */
  .arc{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 180deg,
      var(--cy) calc(var(--d1) * 84deg), rgba(255,255,255,.07) calc(var(--d1) * 84deg) 84deg,
      transparent 84deg 90deg,
      var(--cy) 90deg calc(90deg + var(--d2) * 84deg), rgba(255,255,255,.07) calc(90deg + var(--d2) * 84deg) 174deg,
      transparent 174deg 180deg,
      var(--cy) 180deg calc(180deg + var(--d3) * 84deg), rgba(255,255,255,.07) calc(180deg + var(--d3) * 84deg) 264deg,
      transparent 264deg);
    -webkit-mask:radial-gradient(circle closest-side,transparent 80%,#000 81%);
    mask:radial-gradient(circle closest-side,transparent 80%,#000 81%);
    filter:drop-shadow(0 0 14px rgba(40,232,255,.42))}
  .avwrap{position:relative;display:grid;place-items:center;cursor:pointer}
  .avedit{position:absolute;right:-10px;bottom:-10px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;background:rgba(10,13,28,.95);
    border:1px solid rgba(40,232,255,.55);color:var(--cy);font-size:11px}
  .ptv{display:flex;flex-direction:column;align-items:center;gap:2px}
  .ptv b{font-size:34px;font-weight:900;color:var(--gold);line-height:1;
    text-shadow:0 0 24px rgba(255,209,102,.42)}
  .ptv span{font-size:8.5px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
  .divs{display:flex;gap:7px;align-items:center;font-size:9px;letter-spacing:.2em;
    color:var(--dim);text-transform:uppercase}
  .divs b{color:var(--txt);font-weight:900;letter-spacing:.16em;font-size:13px}
  .divs .now{color:var(--cy)}
  .rail{display:flex;flex-direction:column;gap:6px;width:100%}
  .step{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;
    background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.06);
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .step .stepv{margin-left:auto;letter-spacing:.06em;font-weight:800}
  .step .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.14);flex:0 0 auto}
  .step.done{color:#9fb0d6}
  .step.done .dot{background:var(--cy);box-shadow:0 0 9px rgba(40,232,255,.7)}
  .step.now{color:var(--txt);background:rgba(40,232,255,.07);border-color:rgba(40,232,255,.35);font-weight:900}
  .step.now .dot{background:var(--gold);box-shadow:0 0 11px rgba(255,209,102,.8)}
  .step.locked{opacity:.4;border-style:dashed}
  .step .lockmark{margin-left:6px;color:var(--gold);font-size:9px;letter-spacing:.1em}
  .hist{display:flex;align-items:center;width:100%;padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);cursor:pointer;
    font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  .hist b{color:var(--txt);margin-left:auto;letter-spacing:.06em}
  .acts{display:flex;flex-direction:column;gap:9px;width:100%}
  .acts .btn{width:100%;min-width:0}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><button class="ico">‹</button><span class="ttl">PROFILE</span><span class="pad"></span></div>
  <div class="pane">
    <div class="arcwrap" style="--d1:1;--d2:.58;--d3:0">
      <i class="arc"></i>
      <div class="avwrap dice-static">{{die:5:p1:88}}<span class="avedit">✎</span></div>
    </div>
    <div class="ptv"><b>7,465</b><span>Ladder points</span></div>
    <div class="divs">III<b class="now">GOLD II</b>I</div>
    <div class="rail">
      <div class="step done"><i class="dot"></i>Silver<span class="stepv">5,750</span></div>
      <div class="step now"><i class="dot"></i>Gold<span class="lockmark">▼ floor</span><span class="stepv">6,500</span></div>
      <div class="step locked"><i class="dot"></i>Obsidian<span class="stepv">7,250</span></div>
      <div class="step locked"><i class="dot"></i>Neon<span class="stepv">8,000</span></div>
    </div>
    <div class="hist">Match history <b>19 games ›</b></div>
    <div class="acts">
      <button class="btn">Change nickname</button>
      <button class="btn">Sign out</button>
    </div>
  </div>
</div></div>
