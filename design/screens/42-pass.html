<!-- meta name="Pass the phone" group="4 · Local flow" subtitle="Hand-off between local turns; quitting is the same ✕ as everywhere else" width=412 height=880 links="Game (local)" -->
<style>
  .scr{position:relative}
  .quitico{position:absolute;top:14px;right:16px}
  .pwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto}
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 40% at 50% 50%,color-mix(in srgb,var(--pc) 24%,transparent),transparent 72%)}
  .swapicon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-bottom:2px;
    border:1.5px solid color-mix(in srgb,var(--pc) 45%,transparent);color:var(--pc);font-size:24px;
    box-shadow:0 0 26px color-mix(in srgb,var(--pc) 28%,transparent);animation:spinhint 2.6s ease-in-out infinite}
  @keyframes spinhint{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(180deg)}}
  .who{font-size:34px;font-weight:900;letter-spacing:.16em;color:var(--pc);
    text-shadow:0 0 30px color-mix(in srgb,var(--pc) 65%,transparent);text-align:center;line-height:1.05}
  .hint{font-size:11.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .mini{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900}
  .mini .a{color:var(--cy)}.mini .b{color:var(--mg)}
  .mini span{color:var(--dim);font-size:13px}
  .tapline{margin-top:18px;font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="pglow"></div>
  <button class="ico quitico">✕</button>
  <div class="pwrap">
    <div class="swapicon">⇅</div>
    <div class="who">PLAYER 2</div>
    <div class="hint">Pass the phone</div>
    <div class="mini"><b class="a">12</b><span>—</span><b class="b">8</b></div>
    <div class="tapline">Tap anywhere when ready</div>
  </div>
</div></div>
