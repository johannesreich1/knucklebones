<!-- meta name="Match — LIMITED bag" group="2 · Online flow" subtitle="The bag beside the die in play: face-down dice and a total, never which faces remain" width=412 height=980 links="Game modes" -->
<style>
  .scr{gap:6px}
  .mhud{display:flex;align-items:center;gap:8px;height:30px}
  .mhud .rec{margin-right:auto}
  .board3{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center}
  .col3{display:grid;grid-template-rows:repeat(3,58px);gap:6px;position:relative;border-radius:18px}
  .slot3{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.028);
    border:1px solid rgba(255,255,255,.07);display:grid;place-items:center}
  .side-top .slot3{border-color:rgba(255,47,160,.13)}
  .side-bot .slot3{border-color:rgba(40,232,255,.13)}
  .col3.legal::after{content:"";position:absolute;inset:-4px;border-radius:18px;
    border:1.5px dashed rgba(40,232,255,.6);pointer-events:none}
  .mplate{display:flex;align-items:center;gap:7px;height:24px;max-width:196px;margin:0 auto;width:100%}
  .mplate .dot{width:8px;height:8px;border-radius:50%}
  .mplate .nm{font-size:11.5px;font-weight:800;letter-spacing:.14em}
  .mplate .tot{margin-left:auto;font-size:20px;font-weight:900}
  .mplate.p2 .dot{background:var(--mg);box-shadow:0 0 10px var(--mg)}
  .mplate.p2 .tot{color:var(--mg);text-shadow:0 0 16px var(--mg)}
  .mplate.p1 .dot{background:var(--cy);box-shadow:0 0 10px var(--cy)}
  .mplate.p1 .tot{color:var(--cy);text-shadow:0 0 16px var(--cy)}
  .mplate.idle{opacity:.6}
  .centerrow{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0}
  .mstatus{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--cy);
    text-transform:uppercase;text-shadow:0 0 12px rgba(40,232,255,.5)}
  /* .stagerow / .bag come from the app CSS (main.css) — one implementation
     drives online and offline alike (src/ui/bag.ts) */
  .stagerow > .die{width:54px;height:54px;--cell:54px}
  .depths{display:flex;justify-content:center;gap:26px;margin-top:22px}
  .depths .d{display:flex;flex-direction:column;align-items:center;gap:6px}
  .depths .cap{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="mhud">
    <div class="rec">ONLINE · {{mico:limited:12}} LIMITED <span class="mi">ⓘ</span></div>
    <button class="ico">{{ico:leave:15}}</button>
  </div>

  <div class="mplate p2"><span class="dot"></span><span class="nm">EmberCrow896</span><span class="tot">18</span></div>
  <div class="board3 side-top dice-static">
    <div class="col3"><div class="slot3"></div><div class="slot3"></div><div class="slot3">{{die:6:p2:50}}</div></div>
    <div class="col3"><div class="slot3"></div><div class="slot3">{{die:2:p2:50}}</div><div class="slot3">{{die:2:p2:50}}</div></div>
    <div class="col3"><div class="slot3"></div><div class="slot3"></div><div class="slot3">{{die:4:p2:50}}</div></div>
  </div>

  <div class="centerrow dice-static">
    <div class="stagerow">
      {{die:5:p1:54}}
      <div class="bag">
        <span class="pile"><i class="die"></i><i class="die"></i><i class="die"></i><i class="die gone"></i></span>
        <b class="bn">17</b>
      </div>
    </div>
    <div class="mstatus">Your move</div>
  </div>

  <div class="board3 side-bot dice-static">
    <div class="col3 legal"><div class="slot3">{{die:5:p1:50}}</div><div class="slot3"></div><div class="slot3"></div></div>
    <div class="col3 legal"><div class="slot3">{{die:3:p1:50}}</div><div class="slot3">{{die:3:p1:50}}</div><div class="slot3"></div></div>
    <div class="col3 legal"><div class="slot3">{{die:6:p1:50}}</div><div class="slot3"></div><div class="slot3"></div></div>
  </div>
  <div class="mplate p1"><span class="dot"></span><span class="nm">FrostLynx303</span><span class="tot">31</span></div>

  <!-- the pile thins as the bag drains: the last draws stand alone -->
  <div class="depths dice-static">
    <div class="d"><div class="bag" style="position:static;margin:0"><span class="pile"><i class="die"></i><i class="die"></i><i class="die"></i><i class="die"></i></span><b class="bn">24</b></div><span class="cap">Full</span></div>
    <div class="d"><div class="bag" style="position:static;margin:0"><span class="pile"><i class="die"></i><i class="die"></i><i class="die gone"></i><i class="die gone"></i></span><b class="bn">11</b></div><span class="cap">Halfway</span></div>
    <div class="d"><div class="bag" style="position:static;margin:0"><span class="pile"><i class="die"></i><i class="die gone"></i><i class="die gone"></i><i class="die gone"></i></span><b class="bn">2</b></div><span class="cap">Last dice</span></div>
  </div>
</div></div>
