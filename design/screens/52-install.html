<!-- meta name="Install" group="5 · Sheets" subtitle="iOS explainer sheet; Chrome installs straight from the home footer link" width=412 height=780 links="Home" -->
<style>
  .shead{display:flex;align-items:center;width:100%;max-width:340px;margin:0 auto 10px}
  .shead .ttl{flex:1;text-align:center;font-size:16px;letter-spacing:.26em;font-weight:900;
    background:linear-gradient(100deg,var(--cy),#fff 50%,var(--mg));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .shead .pad{width:30px}
  .iwrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin:auto;max-width:300px}
  .rules{max-height:none}
  .appface{width:74px;height:74px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(135deg,#17123a,#04263a);border:1px solid rgba(255,255,255,.16);
    box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 22px rgba(40,232,255,.25)}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><span class="pad"></span><span class="ttl">INSTALL</span><button class="ico">✕</button></div>
  <div class="iwrap dice-static">
    <div class="appface">{{die:5:p1:44}}</div>
    <div class="rules" style="text-align:center">
      <p>Put the game on your home screen — it opens fullscreen and keeps working offline.</p>
      <p>Tap the <b>Share</b> icon in Safari's toolbar, then <b>Add to Home Screen</b>.</p>
    </div>
    <button class="btn primary">Got it</button>
  </div>
</div></div>
