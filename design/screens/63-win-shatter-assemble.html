<!-- meta name="Win title D — Shatter assemble" group="6 · Win screen studies" subtitle="Letters fly in from scattered angles and lock into line" width=412 height=700 links="Result screen" -->
<style>
  .studio{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
  .panel{position:relative;width:100%;max-width:var(--w-col);height:170px;border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.05),transparent 70%),rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.08)}
  .cap{font-size:9px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
  .psub{font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  /* The title is the app's own gradient text — a study changes only its motion.
     EVERY loop RESTS in the finished state and departs from it: a design card is
     read as a still, so a keyframe set that starts at opacity 0 renders an empty
     card in any gallery that screenshots frame zero. Each loop also waits 1.2s
     before its first departure, so a capture taken shortly after load still
     lands on the finished look. */
  .t{margin:0;font-size:38px;letter-spacing:.2em;font-weight:900;text-align:center;line-height:1.1;
    background-clip:text;-webkit-background-clip:text;color:transparent;white-space:nowrap}
  .t.win{background-image:linear-gradient(100deg,#28e8ff,#fff 50%,#8dffcf);
    filter:drop-shadow(0 0 26px rgba(40,232,255,.45))}
  .t.lose{background-image:linear-gradient(100deg,var(--mg),#fff 55%,#ff8a3d);
    filter:drop-shadow(0 0 26px rgba(255,47,160,.45))}
  .t .l{display:inline-block;white-space:pre}
  .note{font-size:11.5px;line-height:1.6;color:#c6d3ee;max-width:var(--w-col);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px 13px}
  .note b{color:var(--gold)}

  .t .l{animation:shatter 3s cubic-bezier(.15,1.1,.3,1) infinite;animation-delay:calc(1.2s + var(--i)*.035s)}
  @keyframes shatter{0%,4%{transform:none;opacity:1}
    5%{transform:translate(calc(var(--i)*7px - 26px),-42px) rotate(-24deg) scale(1.6);opacity:0}
    25%{transform:none;opacity:1}28%{transform:translateY(-3px)}34%,100%{transform:none;opacity:1}}
</style>
<div class="studio">
  <div class="cap">Variant D · Shatter assemble</div>
  <div class="panel"><h1 class="t win"><span class="l" style="--i:0">V</span><span class="l" style="--i:1">I</span><span class="l" style="--i:2">C</span><span class="l" style="--i:3">T</span><span class="l" style="--i:4">O</span><span class="l" style="--i:5">R</span><span class="l" style="--i:6">Y</span></h1><div class="psub">You out-rolled the machine</div></div>
  <div class="panel"><h1 class="t lose"><span class="l" style="--i:0">D</span><span class="l" style="--i:1">E</span><span class="l" style="--i:2">F</span><span class="l" style="--i:3">E</span><span class="l" style="--i:4">A</span><span class="l" style="--i:5">T</span></h1><div class="psub">The CPU takes this one</div></div>
  <div class="note"><b>The most kinetic.</b> Fun the first time, busy by the twentieth game — and the longer the title, the longer the scatter takes to resolve.</div>
</div>
