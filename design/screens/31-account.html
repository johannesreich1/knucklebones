<!-- meta name="Account" group="3 · Ladder & account" subtitle="Rename, record, sign out — deletion is present but at arm's length" width=412 height=920 links="Home" -->
<style>
  /* proposed shared header (spec: 00-navigation) — reuses the HUD's .ico */
  .shead{display:flex;align-items:center;width:100%;max-width:340px;margin:0 auto}
  .shead .ttl{flex:1;text-align:center;font-size:16px;letter-spacing:.26em;font-weight:900;
    background:linear-gradient(100deg,var(--cy),#fff 50%,var(--mg));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .shead .pad{width:30px}
  .awrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin:14px auto 0}
  .acard{display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px}
  .awho{display:flex;align-items:center;gap:12px}
  .awho .meta{display:flex;flex-direction:column;gap:2px}
  .awho .nm{font-size:15px;font-weight:900;letter-spacing:.06em;color:var(--cy)}
  .awho .sub{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .awrap input{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);color:var(--txt);font-size:14px;font-family:inherit}
  .statrow{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--dim)}
  .statrow b{color:var(--gold);font-weight:900;font-size:14px}
  .danger{margin-top:14px}
  .danger .btn{border-color:rgba(255,47,160,.35);color:#ff9ccb}
  .dnote{font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-align:center;margin-top:5px}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="shead"><button class="ico">‹</button><span class="ttl">ACCOUNT</span><span class="pad"></span></div>
  <div class="awrap">
    <div class="acard dice-static">
      <div class="awho">{{die:5:p1:40}}<span class="meta"><span class="nm">FrostLynx303</span><span class="sub">since Aug 2026</span></span></div>
      <div class="statrow"><span>RATING</span><b>1032</b></div>
      <div class="statrow"><span>RECORD</span><b style="color:var(--txt)">12W – 7L</b></div>
    </div>
    <div class="lbl">Nickname</div>
    <input value="FrostLynx303" maxlength="16">
    <button class="btn">Save name</button>
    <button class="btn">Sign out</button>
    <div class="danger">
      <button class="btn" style="width:100%">Delete account</button>
      <div class="dnote">Two taps. Removes your profile, matches and rating — everywhere, permanently.</div>
    </div>
  </div>
</div></div>
