<!-- meta name="Match — your move" group="2 · Online flow" subtitle="Plates never glow — the status, clock and dashed columns carry the turn; the badge opens the mode's rules" width=412 height=980 links="Result, Game modes" -->
<style>
  /* This card wears the APP's classes — .hud, .plate, .board/.col/.slot,
     .rowchips/.rc, .cols/.chip, .center, .status, .timer, .rec/.rchip — so
     every number and every colour comes from src/styles/main.css. It used to
     keep a private copy of each (.mhud, .mplate, .board3, .mstatus, .mclock)
     and five had already drifted apart from the thing they pictured: a 30px
     HUD against the app's 34, 8px of centre padding against 5, a status line
     with no reserved lane so the boards would jump when it emptied, a
     nameplate a notch tight, and a hard-coded cyan/magenta pair where the app
     writes --c off the side — a slot the player repoints in Settings.

     What is restated below is ONLY what a card cannot reach: the app opens
     these four with a class on <html>, and a card body cannot set one.
       html.clock      flow/timer.showClock — online/play.ts passes true, so
                       every ranked match runs the server clock
       html.rowmode    ui/render.updateScores — ROW SWITCH shows the row rail
       html.rowswitch  same call — the column chips go INVISIBLE, not away:
                       the 20px lane stays, so nothing jumps
       html.sidepts    ui/layout.fit — under a row mode the gutter always
                       clears RAIL_LANE, so ranked ROW SWITCH is ALWAYS seated
                       this way: name centred over the board, running total out
                       in the gutter beside the half */

  /* the two lengths ui/layout.fit measures every frame. The cell is frozen —
     the card draws its board at 58px at every stage — but the GUTTER is not
     allowed to be: it is what is left beside the board, (screen − board) / 2,
     which is layout.ts's own formula. 100cqw is that screen (the .scr content
     box, hence container-type), so the score cluster lands where the app puts
     it at all four stage widths. A single frozen px value cannot: sized for
     the 384 stage it pushed the number back over the board at 336. */
  .scr{--cell:58px;container-type:inline-size}
  .side{position:relative;--gut:calc((100cqw - (3*var(--cell) + 2*var(--gap)))/2)}

  /* html.sidepts. The height here is NOT a spare copy: design/build.mjs fails
     the build if a card styles a class the app pins with height without
     covering it, and .plate is pinned at 24px. Same for .timer's 12px below. */
  .plate{display:grid;grid-template-columns:1fr auto 1fr;height:24px}
  .plate .who{grid-column:2;justify-self:center}
  .plate .sp{grid-column:1;grid-row:1}
  .plate .pright{position:absolute;top:50%;right:calc(var(--gut)/2);transform:translate(50%,-50%);
    flex-direction:column;gap:4px;z-index:3;width:var(--gut);max-width:var(--gut)}
  .plate .tot{font-size:clamp(20px,calc(var(--gut)*.5),27px);min-width:0;text-align:center}

  /* html.rowmode — the pills themselves, and their .has treatment, come from
     main.css .rowchips .rc and cost this card nothing */
  .rowchips{position:absolute;right:100%;margin-right:9px;top:0;display:grid;
    grid-template-rows:repeat(3,var(--cell));gap:var(--gap);align-items:center}
  /* html.rowswitch */
  .cols.idlelane{visibility:hidden}

  /* html.clock: the clocked stage die (.80 of a cell, not .92) and the lane
     the timer holds for the whole game */
  #dieStage{--cell2:calc(var(--cell)*.80)}
  .timer{display:flex;height:12px}
</style>
<div class="stage"><div class="bgfx"></div><div class="scr">
  <div class="hud">
    <!-- the badge is a ROW of chips (ui/render paintBadge), not a label: where
         a chip names a registry entry it IS the way into that entry's rules —
         boot.ts binds .rchip[data-lib] once, ranked and offline alike -->
    <div class="rec">
      <span class="rchip">ONLINE</span>
      <button type="button" class="rchip tapmode" data-lib="modes" data-id="rowswitch">{{mico:rowswitch:12}} ROW SWITCH<span class="mi">ⓘ</span></button>
    </div>
    <div class="sp"></div>
    <button class="ico">{{ico:leave:15}}</button>
  </div>

  <div class="table dice-static">
    <!-- data-owner is what hands each half its colour (main.css .side[data-owner]),
         exactly as online/play.ts sets it: the near half is always you -->
    <section class="side top" data-owner="0">
      <div class="plate">
        <span class="who"><span class="dot"></span><span class="nm">EmberCrow896</span></span>
        <span class="sp"></span>
        <!-- the rune slot and BOUNTY's ✦ tally share this cluster in the games
             that have them; a ranked ROW SWITCH match has neither -->
        <span class="pright"><span class="tot">13</span></span>
      </div>
      <div class="boardwrap"><div class="board">
        <div class="col"><div class="slot"></div><div class="slot">{{die:6:p2}}</div><div class="slot">{{die:2:p2}}</div></div>
        <div class="col"><div class="slot"></div><div class="slot"></div><div class="slot">{{die:4:p2}}</div></div>
        <div class="col"><div class="slot"></div><div class="slot"></div><div class="slot">{{die:1:p2}}</div></div>
        <!-- ROW SWITCH's whole scoreboard: rows 7 / 6 / 0 read from the centre
             out, so the rail runs 0 / 6 / 7 down a mirrored top half -->
        <span class="rowchips">
          <span class="rc"><span class="cs">0</span><span class="mx"></span></span>
          <span class="rc has"><span class="cs">6</span><span class="mx"></span></span>
          <span class="rc has"><span class="cs">7</span><span class="mx"></span></span>
        </span>
      </div></div>
      <div class="cols idlelane"><div class="chip"></div><div class="chip"></div><div class="chip"></div></div>
    </section>

    <section class="center">
      <div class="stagerow"><div id="dieStage">{{die:5:p1}}</div></div>
      <div class="status me">Your move</div>
      <div class="timer"><span class="track"><span class="bar" style="width:62%"></span></span><b></b></div>
    </section>

    <section class="side bot" data-owner="1">
      <div class="cols idlelane"><div class="chip"></div><div class="chip"></div><div class="chip"></div></div>
      <div class="boardwrap"><div class="board">
        <div class="col legal"><div class="slot">{{die:5:p1}}</div><div class="slot"></div><div class="slot"></div></div>
        <div class="col legal"><div class="slot">{{die:3:p1}}</div><div class="slot">{{die:3:p1}}</div><div class="slot"></div></div>
        <div class="col legal"><div class="slot">{{die:6:p1}}</div><div class="slot"></div><div class="slot"></div></div>
        <!-- neither 3 glows: under ROW SWITCH a multiplier is counted along the
             ROW, and these two share a column -->
        <span class="rowchips">
          <span class="rc has"><span class="cs">14</span><span class="mx"></span></span>
          <span class="rc has"><span class="cs">3</span><span class="mx"></span></span>
          <span class="rc"><span class="cs">0</span><span class="mx"></span></span>
        </span>
      </div></div>
      <div class="plate">
        <span class="who"><span class="dot"></span><span class="nm">FrostLynx303</span></span>
        <span class="sp"></span>
        <span class="pright"><span class="tot">17</span></span>
      </div>
    </section>
  </div>
</div></div>
